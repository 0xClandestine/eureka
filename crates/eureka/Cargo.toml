[package]
name = "eureka"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Graph-based AI co-scientist runtime: graph, scheduler, agents, plugins, session"
repository = "https://github.com/eureka-research/eureka"
readme = "README.md"
keywords = ["ai", "agents", "graph", "research"]
categories = ["science", "artificial-intelligence"]

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
serde_json = "1"
serde_yaml = "0.9"
rig-core = { package = "rig-core", version = "0.38", features = ["derive"] }
anyhow = "1"
figment = { version = "0.10", features = ["toml", "env"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true
