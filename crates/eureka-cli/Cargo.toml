[package]
name = "eureka-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI binary for the Eureka AI co-scientist"
categories = ["science", "artificial-intelligence"]

[dependencies]
eureka-graph = { path = "../eureka-graph" }
eureka-agents = { path = "../eureka-agents" }
eureka-engine = { path = "../eureka-engine" }
eureka-config = { path = "../eureka-config" }
eureka-db = { path = "../eureka-db" }
uuid = { version = "1", features = ["v7"] }
rig-core = { package = "rig-core", version = "0.38", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true