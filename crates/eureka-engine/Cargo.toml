[package]
name = "eureka-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Engine: wiring, node registry, session management, and run orchestration for Eureka"
categories = ["science", "artificial-intelligence"]

[dependencies]
eureka-graph = { path = "../eureka-graph" }
eureka-agents = { path = "../eureka-agents" }
eureka-config = { path = "../eureka-config" }
eureka-db = { path = "../eureka-db" }
async-trait = "0.1"
rig-core = { package = "rig-core", version = "0.38" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
chrono = "0.4"

[lints]
workspace = true