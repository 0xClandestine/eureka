[package]
name = "eureka-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Subprocess-based plugin system for Eureka: control nodes and agent tools as external programs"
categories = ["science", "artificial-intelligence"]

[dependencies]
eureka-graph = { path = "../eureka-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "time", "io-util"] }
dirs = "5"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"

[lints]
workspace = true
