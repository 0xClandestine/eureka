name: AI Co-Scientist
description: Reproduction of Google Research's AI co-scientist topology (Feb 2025)

# ── LLM agents ──────────────────────────────────────────────────────────
# Shared tool definitions referenced via YAML anchors by each agent.
tool_defs:
  - &arxiv_search
    name: search_literature
    description: Search arXiv for papers matching a query
    command: [python3, tools/arxiv_search.py]
    args_schema:
      type: object
      required: [query]
      properties:
        query:       { type: string,  description: "Keywords or phrase to search for" }
        max_results: { type: integer, description: "Max results (default 5, max 20)" }
        page:        { type: integer, description: "Page number (default 0)" }
    timeout_secs: 30
  - &arxiv_read
    name: read_paper
    description: Retrieve the full text of an arXiv paper as clean Markdown
    command: [python3, tools/arxiv_search.py]
    args_schema:
      type: object
      required: [arxiv_id]
      properties:
        arxiv_id: { type: string, description: "ArXiv paper ID e.g. 2404.01234" }
    timeout_secs: 60
  - &context_store
    name: context_store
    description: Read or write shared agent context memory (persists across rounds)
    command: [python3, tools/context_store.py]
    args_schema:
      type: object
      required: [action]
      properties:
        action:  { type: string, enum: [read, write, list, read_round, delete] }
        key:     { type: string, description: "Context key to read/write/delete" }
        value:   { type: object, description: "JSON value to store (for write action)" }
        prefix:  { type: string, description: "Key prefix filter (for list action)" }
        round:   { type: integer, description: "Round number (for read_round action)" }
        namespace: { type: string, description: "Logical namespace, defaults to 'shared'" }
    timeout_secs: 10

agents:
  - id: generation
    description: Drafts novel hypotheses from the research goal via literature
                 exploration, self-play debates, and assumption decomposition
    prompt: prompts/generation.md
    inputs:
      - port: in
        kind: Goal
      - port: context
        kind: Insights
        required: false
    outputs:
      - port: out
        kind: Hypotheses
    tools: [*arxiv_search, *arxiv_read, *context_store]
    output_schema:
      type: object
      required: [hypotheses]
      properties:
        hypotheses:
          type: array
          description: List of generated scientific hypotheses
          items:
            type: object
            required: [statement, rationale, assumptions, testable_predictions, proposed_experiment]
            properties:
              statement:            { type: string, description: "One-sentence hypothesis claim" }
              rationale:            { type: string, description: "Mechanistic or theoretical justification with citations" }
              assumptions:          { type: array, items: { type: string }, description: "Explicit testable intermediate assumptions" }
              testable_predictions: { type: array, items: { type: string }, description: "Falsifiable, concrete predictions" }
              proposed_experiment:  { type: string, description: "Concrete experimental design for validation" }
              citations:            { type: array, items: { type: object }, description: "Supporting literature references" }

  - id: safety_review
    description: Screens hypotheses for dual-use risk, ethical compliance,
                 experimental safety, and regulatory alignment before review
    prompt: prompts/safety_review.md
    inputs:
      - port: in
        kind: Hypotheses
    outputs:
      - port: out
        kind: Hypotheses
    output_schema:
      type: object
      required: [hypotheses]
      properties:
        hypotheses:
          type: array
          description: Filtered set of safe hypotheses with safety assessments attached
          items:
            type: object
            required: [hypothesis, safe, recommendation]
            properties:
              hypothesis:     { type: object, description: "Full hypothesis object pass-through" }
              safe:           { type: boolean, description: "True if hypothesis passes all safety checks" }
              safety_concerns: { type: array, items: { type: string } }
              recommendation: { type: string, enum: [proceed, revise, reject] }
              rationale:      { type: string }

  - id: critic
    description: Adversarial reviewer — challenges hypotheses through literature
                 attack, assumption decomposition, and experiment critique;
                 sharpens counter-arguments each round using the advocate's rebuttal
    prompt: prompts/critic.md
    inputs:
      - port: in
        kind: Hypotheses
      - port: rebuttal
        kind: Reviews
        required: false
      - port: context
        kind: Insights
        required: false
    outputs:
      - port: out
        kind: Reviews
    tools: [*arxiv_search, *arxiv_read, *context_store]
    output_schema:
      type: object
      required: [reviews]
      properties:
        reviews:
          type: array
          description: One critique entry per hypothesis
          items:
            type: object
            required: [hypothesis, kind, reasoning, score]
            properties:
              hypothesis:  { type: object, description: "Full hypothesis object pass-through" }
              kind:        { type: string, enum: [initial, literature, assumption, experiment, adversarial, escalation] }
              eliminated:  { type: boolean, description: "True if hypothesis should be discarded" }
              reasoning:   { type: string, description: "Detailed challenge with evidence" }
              weaknesses:  { type: array, items: { type: string } }
              suggestions: { type: array, items: { type: string } }
              score:       { type: number, description: "Preliminary quality score 0–10 (advocate may revise)" }

  - id: advocate
    description: Scientific defender — responds to critic's challenges with
                 evidence, concedes valid objections, refines hypotheses, and
                 produces the authoritative final review for ranking
    prompt: prompts/advocate.md
    inputs:
      - port: in
        kind: Reviews
      - port: context
        kind: Insights
        required: false
    outputs:
      - port: out
        kind: Reviews
    tools: [*arxiv_search, *arxiv_read, *context_store]
    output_schema:
      type: object
      required: [reviews]
      properties:
        reviews:
          type: array
          description: Final review entries after debate synthesis
          items:
            type: object
            required: [hypothesis, kind, reasoning, score, rebuttal]
            properties:
              hypothesis:  { type: object, description: "Full hypothesis object (potentially refined)" }
              kind:        { type: string, enum: [debate_synthesis] }
              eliminated:  { type: boolean, description: "True if hypothesis did not survive debate" }
              reasoning:   { type: string, description: "Final balanced assessment after debate" }
              strengths:   { type: array, items: { type: string } }
              weaknesses:  { type: array, items: { type: string }, description: "Conceded weaknesses" }
              rebuttal:    { type: string, description: "Summary of responses to critic's objections" }
              score:       { type: number, description: "Post-debate quality score 0–10" }

  - id: evolution
    description: Refines top hypotheses via grounding, coherence, inspiration,
                 combination, simplification, and out-of-box thinking
    prompt: prompts/evolution.md
    inputs:
      - port: in
        kind: Hypotheses
      - port: context
        kind: Insights
        required: false
    outputs:
      - port: out
        kind: Hypotheses
    tools: [*arxiv_search, *arxiv_read, *context_store]
    output_schema:
      type: object
      required: [hypotheses]
      properties:
        hypotheses:
          type: array
          description: Evolved offspring hypotheses
          items:
            type: object
            required: [statement, rationale, operation, change_rationale]
            properties:
              parent_indices:       { type: array, items: { type: integer }, description: "Indices into the input hypothesis list" }
              operation:            { type: string, enum: [grounding, coherence, inspiration, combination, simplification, out_of_box] }
              change_rationale:     { type: string, description: "What was changed from the parent and why" }
              statement:            { type: string }
              rationale:            { type: string }
              assumptions:          { type: array, items: { type: string } }
              testable_predictions: { type: array, items: { type: string } }
              proposed_experiment:  { type: string }
              citations:            { type: array, items: { type: object } }

  - id: meta_review
    description: Synthesises tournament insights, feeds back to all agents,
                 identifies research contacts, produces final overview
    prompt: prompts/meta_review.md
    inputs:
      - port: in
        kind: Ranking
    outputs:
      - port: insights
        kind: Insights
      - port: overview
        kind: Overview
    output_schema:
      type: object
      required: [insights, overview]
      properties:
        insights:
          type: object
          description: Per-agent feedback for use in the next round
          properties:
            generation_context:    { type: array, items: { type: string }, description: "Specific directions and gaps for the Generation agent" }
            reflection_heuristics: { type: array, items: { type: string }, description: "Review patterns and heuristics for the Reflection agent" }
            evolution_guidance:    { type: array, items: { type: string }, description: "Strategy observations for the Evolution agent" }
            recurring_patterns:    { type: array, items: { type: string }, description: "Themes appearing across top hypotheses" }
            common_weaknesses:     { type: array, items: { type: string } }
            promising_directions:  { type: array, items: { type: string } }
            context_improvements:  { type: array, items: { type: string } }
        overview:
          type: object
          description: Comprehensive research synthesis
          properties:
            summary:              { type: string, description: "Original goal, approach, and top findings" }
            key_insights:         { type: array, items: { type: string } }
            open_questions:       { type: array, items: { type: string } }
            suggested_next_steps: { type: array, items: { type: string } }
            research_contacts:
              type: array
              description: Domain experts who should review the findings
              items:
                type: object
                properties:
                  expertise: { type: string }
                  rationale: { type: string }

# ── Control nodes (subprocess-backed) ─────────────────────────────────
control:
  - id: ranking
    kind: elo-ranker
    description: Elo tournament with similarity-based matchmaking from proximity graph
    command: [python3, control/ranker.py]
    inputs:
      - port: in
        kind: Reviews
      - port: graph
        kind: ProximityGraph
        required: false
    outputs:
      - port: top
        kind: Hypotheses
      - port: state
        kind: Ranking
    config:
      items_field: reviews
      score_field: score
      item_field: hypothesis
      id_field: statement
      output_field: hypotheses
      top_k: 5
    timeout_secs: 15

  - id: proximity
    kind: proximity
    description: Builds similarity graph, clusters hypotheses, selects diverse frontier
    command: [python3, control/proximity.py]
    inputs:
      - port: in
        kind: Hypotheses
    outputs:
      - port: unique
        kind: Hypotheses
      - port: graph
        kind: ProximityGraph
    config:
      items_field: hypotheses
      text_field: statement
      threshold: 0.65
      output_field: hypotheses
      max_frontier: 10
      # similarity_mode: "tfidf" (default) or "jaccard" for word-level fallback
      similarity_mode: tfidf
    timeout_secs: 15

  - id: supervisor
    kind: supervisor
    description: Dynamic orchestrator — computes statistics, tracks convergence,
                 persists context memory, decides continue/evolve/halt
    command: [python3, control/supervisor.py]
    inputs:
      - port: in
        kind: Hypotheses
      - port: ranking
        kind: Ranking
        required: false
    outputs:
      - port: continue
        kind: Hypotheses
      - port: halt
        kind: Control
    config:
      max_rounds: 5
      min_rounds: 2
      convergence_threshold: 200.0
      min_hypotheses: 3
    timeout_secs: 10

# ── Graph topology ─────────────────────────────────────────────────────
# Forward pipeline: generation → safety_review → critic → advocate → ranking
#                   → evolution → proximity → supervisor
# Debate loop:      advocate → critic (feedback — each outer round the critic
#                   sharpens its challenge using the advocate's prior rebuttal)
# Feedback loops:   supervisor → critic (continue), proximity.graph → ranking,
#                   meta_review.insights → generation, critic, advocate, evolution
#                   ranking.state → supervisor (statistics)
edges:
  # ── Forward pipeline ──
  - from_node: generation
    from_port: out
    to_node: safety_review
    to_port: in

  - from_node: safety_review
    from_port: out
    to_node: critic
    to_port: in

  - from_node: critic
    from_port: out
    to_node: advocate
    to_port: in

  - from_node: advocate
    from_port: out
    to_node: ranking
    to_port: in

  - from_node: ranking
    from_port: top
    to_node: evolution
    to_port: in

  - from_node: evolution
    from_port: out
    to_node: proximity
    to_port: in

  - from_node: proximity
    from_port: unique
    to_node: supervisor
    to_port: in

  # ── Proximity graph → Ranking matchmaking ──
  - from_node: proximity
    from_port: graph
    to_node: ranking
    to_port: graph

  # ── Tournament state → Meta-review ──
  - from_node: ranking
    from_port: state
    to_node: meta_review
    to_port: in

  # ── Tournament state → Supervisor (for statistics & convergence) ──
  - from_node: ranking
    from_port: state
    to_node: supervisor
    to_port: ranking

  # ── Debate loop: advocate rebuttal → critic (sharpens next challenge) ──
  - from_node: advocate
    from_port: out
    to_node: critic
    to_port: rebuttal
    feedback: true

  # ── Meta-review feedback → all agents ──
  - from_node: meta_review
    from_port: insights
    to_node: generation
    to_port: context
    feedback: true

  - from_node: meta_review
    from_port: insights
    to_node: critic
    to_port: context
    feedback: true

  - from_node: meta_review
    from_port: insights
    to_node: advocate
    to_port: context
    feedback: true

  - from_node: meta_review
    from_port: insights
    to_node: evolution
    to_port: context
    feedback: true

  # ── Supervisor feedback loop ──
  - from_node: supervisor
    from_port: continue
    to_node: critic
    to_port: in
    feedback: true

metadata:
  version: 0.7.0
  author: Eureka Team
  reference: Google Research, AI co-scientist, Feb 2025