name: AI Co-Scientist
description: Reproduction of Google Research's AI co-scientist topology (Feb 2025)

# Optional: path to a directory of static files to serve as the web UI.
# Relative paths resolve against this YAML file's parent directory.
frontend: .

# ── LLM agents ──────────────────────────────────────────────────────────
# Shared tool definitions referenced via YAML anchors by each agent.
tool_defs:
  - &arxiv_search
    name: search_literature
    description: Search arXiv for papers matching a query
    command: [python3, tools/arxiv_search.py]
    args_schema:
      type: object
      required: [query]
      properties:
        query:       { type: string,  description: "Keywords or phrase to search for" }
        max_results: { type: integer, description: "Max results (default 5, max 20)" }
        page:        { type: integer, description: "Page number (default 0)" }
    timeout_secs: 30
  - &arxiv_read
    name: read_paper
    description: Retrieve a paper from arXiv by ID. Without `sections`, returns a token‑efficient overview (title + TOC with previews). With `sections`, returns full text of only the requested sections (by index or heading name).
    command: [python3, tools/arxiv_search.py]
    args_schema:
      type: object
      required: [arxiv_id]
      properties:
        arxiv_id: { type: string, description: "ArXiv paper ID e.g. 2404.01234" }
        sections:
          type: array
          items: { type: string }
          description: "Optional: section indices (0-based) or heading names to retrieve in full. If omitted, returns an overview TOC."
    timeout_secs: 60
  - &context_store
    name: context_store
    description: Read or write shared agent context memory (persists across rounds)
    command: [python3, tools/context_store.py]
    args_schema:
      type: object
      required: [action]
      properties:
        action:  { type: string, enum: [read, write, list, read_round, delete] }
        key:     { type: string, description: "Context key to read/write/delete" }
        value:   { type: object, description: "JSON value to store (for write action)" }
        prefix:  { type: string, description: "Key prefix filter (for list action)" }
        round:   { type: integer, description: "Round number (for read_round action)" }
        namespace: { type: string, description: "Logical namespace, defaults to 'shared'" }
    timeout_secs: 10

agents:
  - id: plan
    description: Parses the raw research goal into a structured research plan
                 configuration (domain, focus areas, constraints, criteria) that
                 guides all downstream agents
    prompt: prompts/plan.md
    inputs:
      - port: in
        kind: Goal
    outputs:
      - port: out
        kind: PlanConfig
    output_schema:
      type: object
      required: [plan]
      properties:
        plan:
          type: object
          required: [domain, research_goal, focus_areas, hypothesis_criteria, evaluation_criteria]
          properties:
            domain:              { type: string, description: "Primary scientific field" }
            research_goal:       { type: string, description: "Clarified one-sentence goal" }
            constraints:         { type: array, items: { type: string }, description: "Explicit scope limitations" }
            focus_areas:         { type: array, items: { type: string }, description: "Specific sub-areas or mechanisms to explore" }
            methods_to_avoid:    { type: array, items: { type: string }, description: "Out-of-scope or infeasible approaches" }
            hypothesis_criteria: { type: array, items: { type: string }, description: "Checklist a hypothesis must satisfy to be on-topic" }
            evaluation_criteria: { type: array, items: { type: string }, description: "How to judge whether a hypothesis addresses the goal" }

  - id: generation
    description: Drafts novel hypotheses from the structured research plan via
                 literature exploration, assumption decomposition, and research expansion
    prompt: prompts/generation.md
    inputs:
      - port: in
        kind: PlanConfig
      - port: context
        kind: Insights
        required: false
    outputs:
      - port: out
        kind: Hypotheses
    tools: [*arxiv_search, *arxiv_read, *context_store]
    output_schema:
      type: object
      required: [hypotheses]
      properties:
        hypotheses:
          type: array
          description: List of generated scientific hypotheses
          items:
            type: object
            required: [statement, rationale, assumptions, testable_predictions, proposed_experiment]
            properties:
              statement:            { type: string, description: "One-sentence hypothesis claim" }
              rationale:            { type: string, description: "Mechanistic or theoretical justification with citations" }
              assumptions:          { type: array, items: { type: string }, description: "Explicit testable intermediate assumptions" }
              testable_predictions: { type: array, items: { type: string }, description: "Falsifiable, concrete predictions" }
              proposed_experiment:  { type: string, description: "Concrete experimental design for validation" }
              citations:            { type: array, items: { type: object }, description: "Supporting literature references" }

  - id: critic
    description: Adversarial reviewer — challenges a single hypothesis through
                 literature attack, assumption decomposition, and experiment
                 critique; escalates each round using the debate_history embedded
                 in the hypothesis object
    prompt: prompts/critic.md
    inputs:
      - port: in
        kind: HypothesisItem
      - port: context
        kind: Insights
        required: false
    outputs:
      - port: out
        kind: ReviewItem
    tools: [*arxiv_search, *arxiv_read, *context_store]
    output_schema:
      type: object
      required: [review, _batch_id, _batch_index, _batch_total]
      properties:
        review:
          type: object
          required: [hypothesis, kind, reasoning, score]
          description: Critique of a single hypothesis
          properties:
            hypothesis:  { type: object, description: "Full hypothesis object pass-through (including debate_history unchanged)" }
            kind:        { type: string, enum: [initial, literature, assumption, experiment, adversarial] }
            eliminated:  { type: boolean, description: "True if hypothesis should be discarded" }
            reasoning:   { type: string, description: "Detailed challenge with evidence" }
            weaknesses:  { type: array, items: { type: string } }
            suggestions: { type: array, items: { type: string } }
            score:       { type: number, description: "Preliminary quality score 0–10 (advocate may revise)" }
        _batch_id:    { type: string,  description: "Batch routing ID — copy unchanged from input" }
        _batch_index: { type: integer, description: "Item position in batch — copy unchanged from input" }
        _batch_total: { type: integer, description: "Total items in batch — copy unchanged from input" }

  - id: advocate
    description: Scientific defender — responds to the critic's challenge on a
                 single hypothesis, concedes valid objections, appends this
                 round's debate to hypothesis.debate_history, and produces the
                 authoritative final review for ranking
    prompt: prompts/advocate.md
    inputs:
      - port: in
        kind: ReviewItem
      - port: context
        kind: Insights
        required: false
    outputs:
      - port: out
        kind: ReviewItem
    tools: [*arxiv_search, *arxiv_read, *context_store]
    output_schema:
      type: object
      required: [review, _batch_id, _batch_index, _batch_total]
      properties:
        review:
          type: object
          required: [hypothesis, kind, reasoning, score, rebuttal]
          description: Final review after debate, with updated hypothesis
          properties:
            hypothesis:
              type: object
              description: "Full hypothesis object with debate_history updated for this round"
              properties:
                debate_history:
                  type: array
                  description: "Append one entry: { round_critique, round_rebuttal }"
                  items:
                    type: object
                    required: [round_critique, round_rebuttal]
                    properties:
                      round_critique: { type: string, description: "Summary of the critic's main challenge this round" }
                      round_rebuttal: { type: string, description: "Summary of your response" }
            kind:       { type: string, enum: [debate_synthesis] }
            eliminated: { type: boolean, description: "True if hypothesis did not survive debate" }
            reasoning:  { type: string, description: "Final balanced assessment" }
            strengths:  { type: array, items: { type: string } }
            weaknesses: { type: array, items: { type: string }, description: "Conceded weaknesses" }
            rebuttal:   { type: string, description: "Summary of responses to critic's objections" }
            score:      { type: number, description: "Post-debate quality score 0–10" }
        _batch_id:    { type: string,  description: "Batch routing ID — copy unchanged from input" }
        _batch_index: { type: integer, description: "Item position in batch — copy unchanged from input" }
        _batch_total: { type: integer, description: "Total items in batch — copy unchanged from input" }

  - id: evolution
    description: Refines top hypotheses via grounding, coherence, inspiration,
                 combination, simplification, and out-of-box thinking
    prompt: prompts/evolution.md
    inputs:
      - port: in
        kind: Hypotheses
      - port: context
        kind: Insights
        required: false
    outputs:
      - port: out
        kind: Hypotheses
    tools: [*arxiv_search, *arxiv_read, *context_store]
    output_schema:
      type: object
      required: [hypotheses]
      properties:
        hypotheses:
          type: array
          description: Evolved offspring hypotheses
          items:
            type: object
            required: [statement, rationale, operation, change_rationale]
            properties:
              parent_indices:       { type: array, items: { type: integer }, description: "Indices into the input hypothesis list" }
              operation:            { type: string, enum: [grounding, coherence, inspiration, combination, simplification, out_of_box] }
              change_rationale:     { type: string, description: "What was changed from the parent and why" }
              statement:            { type: string }
              rationale:            { type: string }
              assumptions:          { type: array, items: { type: string } }
              testable_predictions: { type: array, items: { type: string } }
              proposed_experiment:  { type: string }
              citations:            { type: array, items: { type: object } }

  - id: meta_review
    description: Synthesises tournament insights, feeds back to all agents,
                 identifies research contacts, produces final overview
    prompt: prompts/meta_review.md
    inputs:
      - port: in
        kind: Ranking
    outputs:
      - port: insights
        kind: Insights
      - port: overview
        kind: Overview
    output_schema:
      type: object
      required: [insights, overview]
      properties:
        insights:
          type: object
          description: Per-agent feedback for use in the next round
          properties:
            generation_context:    { type: array, items: { type: string }, description: "Specific directions and gaps for the Generation agent" }
            debate_heuristics:     { type: array, items: { type: string }, description: "Challenge and rebuttal patterns for the Critic and Advocate agents" }
            evolution_guidance:    { type: array, items: { type: string }, description: "Strategy observations for the Evolution agent" }
            recurring_patterns:    { type: array, items: { type: string }, description: "Themes appearing across top hypotheses" }
            common_weaknesses:     { type: array, items: { type: string } }
            promising_directions:  { type: array, items: { type: string } }
            context_improvements:  { type: array, items: { type: string } }
        overview:
          type: object
          description: Comprehensive research synthesis
          properties:
            summary:              { type: string, description: "Original goal, approach, and top findings" }
            key_insights:         { type: array, items: { type: string } }
            open_questions:       { type: array, items: { type: string } }
            suggested_next_steps: { type: array, items: { type: string } }
            research_contacts:
              type: array
              description: Domain experts who should review the findings
              items:
                type: object
                properties:
                  expertise: { type: string }
                  rationale: { type: string }

# ── Control nodes (subprocess-backed) ─────────────────────────────────
control:
  - id: ranking
    kind: elo-ranker
    description: Elo tournament with similarity-based matchmaking from proximity graph
    command: [python3, control/ranker.py]
    inputs:
      - port: in
        kind: Reviews
      - port: graph
        kind: ProximityGraph
        required: false
    outputs:
      - port: top
        kind: Hypotheses
      - port: state
        kind: Ranking
    config:
      items_field: reviews
      score_field: score
      item_field: hypothesis
      id_field: statement
      output_field: hypotheses
      top_k: 5
    timeout_secs: 15

  - id: proximity
    kind: proximity
    description: Builds similarity graph, clusters hypotheses, selects diverse frontier
    command: [python3, control/proximity.py]
    inputs:
      - port: in
        kind: Hypotheses
    outputs:
      - port: unique
        kind: Hypotheses
      - port: graph
        kind: ProximityGraph
    config:
      items_field: hypotheses
      text_field: statement
      threshold: 0.65
      output_field: hypotheses
      max_frontier: 10
      # similarity_mode: "tfidf" (default) or "jaccard" for word-level fallback
      similarity_mode: tfidf
    timeout_secs: 15

  - id: supervisor
    kind: supervisor
    description: Dynamic orchestrator — computes statistics, tracks convergence,
                 persists context memory, decides continue/evolve/halt
    command: [python3, control/supervisor.py]
    inputs:
      - port: in
        kind: Hypotheses
      - port: ranking
        kind: Ranking
        required: false
    outputs:
      - port: continue
        kind: Hypotheses
      - port: halt
        kind: Control
    config:
      max_rounds: 5
      min_rounds: 2
      convergence_threshold: 200.0
      min_hypotheses: 3
    timeout_secs: 10

  - id: scatter
    kind: scatter
    description: Explodes a hypotheses array into individual HypothesisItem
                 artifacts — one per hypothesis — so critic and advocate can
                 process each hypothesis in parallel
    command: [python3, control/scatter.py]
    inputs:
      - port: in
        kind: Hypotheses
    outputs:
      - port: item
        kind: HypothesisItem
    timeout_secs: 5

  - id: gather
    kind: gather
    description: Collects individual ReviewItems back into a Reviews array.
                 Fires once per item; emits only when the full batch (tracked
                 by _batch_total) has arrived, then forwards to ranking
    command: [python3, control/gather.py]
    inputs:
      - port: in
        kind: ReviewItem
    outputs:
      - port: out
        kind: Reviews
    timeout_secs: 30

# ── Graph topology ─────────────────────────────────────────────────────
# Forward pipeline:
#   plan → generation → scatter → critic → advocate → gather → ranking
#                                                             → evolution → proximity → supervisor
#
# Per-hypothesis parallelism:
#   scatter emits one HypothesisItem per hypothesis → N parallel critic+advocate
#   pairs → gather collects all N ReviewItems → ranking sees the full set
#
# Debate history:
#   advocate appends { round_critique, round_rebuttal } to hypothesis.debate_history
#   each round; critic reads debate_history from the hypothesis object in the
#   next round and escalates accordingly. No cross-round rebuttal port needed.
#
# Feedback loops:
#   supervisor.continue → scatter (next round re-scatters the top-k pool)
#   meta_review.insights → generation, critic, advocate, evolution
#   ranking.state → meta_review, supervisor
#   proximity.graph → ranking (matchmaking)
edges:
  # ── Forward pipeline ──
  - from_node: plan
    from_port: out
    to_node: generation
    to_port: in

  - from_node: generation
    from_port: out
    to_node: scatter
    to_port: in

  # scatter emits N HypothesisItem artifacts; each triggers one critic activation
  - from_node: scatter
    from_port: item
    to_node: critic
    to_port: in

  - from_node: critic
    from_port: out
    to_node: advocate
    to_port: in

  # N advocate results flow independently to gather
  - from_node: advocate
    from_port: out
    to_node: gather
    to_port: in

  # gather emits once when all N items have arrived
  - from_node: gather
    from_port: out
    to_node: ranking
    to_port: in

  - from_node: ranking
    from_port: top
    to_node: evolution
    to_port: in

  - from_node: evolution
    from_port: out
    to_node: proximity
    to_port: in

  - from_node: proximity
    from_port: unique
    to_node: supervisor
    to_port: in

  # ── Proximity graph → ranking matchmaking ──
  - from_node: proximity
    from_port: graph
    to_node: ranking
    to_port: graph

  # ── Tournament state → meta-review and supervisor ──
  - from_node: ranking
    from_port: state
    to_node: meta_review
    to_port: in

  - from_node: ranking
    from_port: state
    to_node: supervisor
    to_port: ranking

  # ── Supervisor feedback: re-scatter the continuing hypothesis pool ──
  - from_node: supervisor
    from_port: continue
    to_node: scatter
    to_port: in
    feedback: true

  # ── Meta-review feedback → all agents ──
  - from_node: meta_review
    from_port: insights
    to_node: generation
    to_port: context
    feedback: true

  - from_node: meta_review
    from_port: insights
    to_node: critic
    to_port: context
    feedback: true

  - from_node: meta_review
    from_port: insights
    to_node: advocate
    to_port: context
    feedback: true

  - from_node: meta_review
    from_port: insights
    to_node: evolution
    to_port: context
    feedback: true

metadata:
  version: 0.7.0
  author: Eureka Team
  reference: Google Research, AI co-scientist, Feb 2025
