<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eureka — AI Co-Scientist</title>
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       Design Tokens
       ═══════════════════════════════════════════════════════════════════ */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root {
      --bg:#f0f0f5; --bg-elevated:#ffffff; --bg-inset:#f4f4f9; --bg-hover:#ebebf1; --bg-active:#e2e2e8;
      --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14);
      --text:#18181b; --text-secondary:#68686e; --text-tertiary:#b0b0b8;
      --accent:#0071e3; --accent-bg:rgba(0,113,227,.09);
      --green:#24893c; --green-bg:rgba(36,137,60,.1);
      --amber:#b05e00; --amber-bg:rgba(176,94,0,.1);
      --red:#d12b2b; --red-bg:rgba(209,43,43,.1);
      --purple:#8840a8; --purple-bg:rgba(136,64,168,.1);
      --teal:#00789a; --teal-bg:rgba(0,120,154,.1);
      --shadow-sm:0 1px 3px rgba(0,0,0,.07),0 0 1px rgba(0,0,0,.04);
      --shadow-md:0 4px 16px rgba(0,0,0,.09),0 1px 3px rgba(0,0,0,.05);
      --shadow-lg:0 12px 40px rgba(0,0,0,.11),0 2px 6px rgba(0,0,0,.06);
      --radius:14px; --radius-sm:10px; --radius-pill:100px;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable",system-ui,sans-serif;
      --mono:"SF Mono","JetBrains Mono",ui-monospace,monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#000000; --bg-elevated:#1a1a1c; --bg-inset:#252527; --bg-hover:#2d2d2f; --bg-active:#3a3a3c;
        --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.17);
        --text:#f4f4f6; --text-secondary:rgba(240,240,248,.65); --text-tertiary:rgba(240,240,248,.36);
        --accent:#0a84ff; --accent-bg:rgba(10,132,255,.13);
        --green:#30d158; --green-bg:rgba(48,209,88,.11);
        --amber:#ff9f0a; --amber-bg:rgba(255,159,10,.11);
        --red:#ff453a; --red-bg:rgba(255,69,58,.11);
        --purple:#bf5af2; --purple-bg:rgba(191,90,242,.11);
        --teal:#5ac8fa; --teal-bg:rgba(90,200,250,.11);
        --shadow-sm:0 1px 3px rgba(0,0,0,.3),0 0 1px rgba(0,0,0,.2);
        --shadow-md:0 4px 20px rgba(0,0,0,.38),0 1px 4px rgba(0,0,0,.22);
        --shadow-lg:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
      }
    }
    :root.theme-light {
      --bg:#f0f0f5; --bg-elevated:#ffffff; --bg-inset:#f4f4f9; --bg-hover:#ebebf1; --bg-active:#e2e2e8;
      --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14);
      --text:#18181b; --text-secondary:#68686e; --text-tertiary:#b0b0b8;
      --accent:#0071e3; --accent-bg:rgba(0,113,227,.09);
      --green:#24893c; --green-bg:rgba(36,137,60,.1); --amber:#b05e00; --amber-bg:rgba(176,94,0,.1);
      --red:#d12b2b; --red-bg:rgba(209,43,43,.1); --purple:#8840a8; --purple-bg:rgba(136,64,168,.1);
      --teal:#00789a; --teal-bg:rgba(0,120,154,.1);
      --shadow-sm:0 1px 3px rgba(0,0,0,.07),0 0 1px rgba(0,0,0,.04);
      --shadow-md:0 4px 16px rgba(0,0,0,.09),0 1px 3px rgba(0,0,0,.05);
      --shadow-lg:0 12px 40px rgba(0,0,0,.11),0 2px 6px rgba(0,0,0,.06);
    }
    :root.theme-dark {
      --bg:#000000; --bg-elevated:#1a1a1c; --bg-inset:#252527; --bg-hover:#2d2d2f; --bg-active:#3a3a3c;
      --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.17);
      --text:#f4f4f6; --text-secondary:rgba(240,240,248,.65); --text-tertiary:rgba(240,240,248,.36);
      --accent:#0a84ff; --accent-bg:rgba(10,132,255,.13);
      --green:#30d158; --green-bg:rgba(48,209,88,.11); --amber:#ff9f0a; --amber-bg:rgba(255,159,10,.11);
      --red:#ff453a; --red-bg:rgba(255,69,58,.11); --purple:#bf5af2; --purple-bg:rgba(191,90,242,.11);
      --teal:#5ac8fa; --teal-bg:rgba(90,200,250,.11);
      --shadow-sm:0 1px 3px rgba(0,0,0,.3),0 0 1px rgba(0,0,0,.2);
      --shadow-md:0 4px 20px rgba(0,0,0,.38),0 1px 4px rgba(0,0,0,.22);
      --shadow-lg:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
    }

    /* ═══════════════════════════════════════════════════════════════════
       Base
       ═══════════════════════════════════════════════════════════════════ */
    body {
      font-family:var(--font); background:var(--bg); color:var(--text);
      min-height:100vh; -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
    }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    button { font-family:var(--font); cursor:pointer; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
    ::selection { background:var(--accent-bg); }

    /* ═══════════════════════════════════════════════════════════════════
       Layout
       ═══════════════════════════════════════════════════════════════════ */
    .app { max-width:1160px; margin:0 auto; padding:24px 24px 64px; display:flex; flex-direction:column; gap:16px; }
    .hidden { display:none !important; }
    .text-right { text-align:right; }
    .text-center { text-align:center; }
    .mono { font-family:var(--mono); }

    /* ═══════════════════════════════════════════════════════════════════
       Header
       ═══════════════════════════════════════════════════════════════════ */
    .header {
      display:flex; align-items:stretch; gap:0; flex-wrap:wrap;
      background:var(--bg-elevated); border:1px solid var(--border);
      border-radius:var(--radius); box-shadow:var(--shadow-md);
      position:relative; overflow:hidden;
    }
    .header::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background:linear-gradient(90deg,var(--accent) 0%,var(--purple) 100%);
    }
    .header-main { display:flex; align-items:center; gap:14px; padding:16px 20px; flex:1; min-width:0; }
    .header-logo {
      width:40px; height:40px; border-radius:11px; flex-shrink:0;
      background:linear-gradient(140deg,var(--accent) 0%,var(--purple) 100%);
      display:flex; align-items:center; justify-content:center; font-size:19px;
      box-shadow:0 3px 12px rgba(0,113,227,.35);
    }
    .header-info { flex:1; min-width:0; }
    .header-title { font-size:17px; font-weight:700; letter-spacing:-.025em; }
    .header-subtitle { font-size:11px; color:var(--text-secondary); margin-top:2px; letter-spacing:.01em; }
    .header-stats { display:flex; align-items:stretch; }
    .hstat {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-width:72px; padding:16px 18px;
      border-left:1px solid var(--border);
    }
    .hstat-val { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.025em; line-height:1; }
    .hstat-lbl { font-size:9px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.09em; margin-top:4px; }
    .header-actions { display:flex; gap:6px; align-items:center; padding:0 16px; border-left:1px solid var(--border); }

    /* ═══════════════════════════════════════════════════════════════════
       Buttons
       ═══════════════════════════════════════════════════════════════════ */
    .btn {
      display:inline-flex; align-items:center; gap:5px; padding:7px 14px;
      border:1px solid var(--border); border-radius:8px; background:var(--bg-elevated);
      color:var(--text-secondary); font-size:12px; font-weight:600;
      transition:all .15s; white-space:nowrap;
    }
    .btn:hover { border-color:var(--border-strong); color:var(--text); background:var(--bg-hover); }
    .btn:active { transform:scale(.97); }
    .btn.icon { padding:7px 9px; }
    .btn-danger { color:var(--red); border-color:var(--red); }
    .btn-danger:hover { background:var(--red-bg); }
    .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-primary:hover { opacity:.9; background:var(--accent); color:#fff; }
    .btn:disabled { opacity:.35; pointer-events:none; }

    /* ═══════════════════════════════════════════════════════════════════
       Status Pill
       ═══════════════════════════════════════════════════════════════════ */
    .status-pill { display:inline-flex; align-items:center; gap:6px; padding:5px 13px;
      border-radius:var(--radius-pill); font-size:12px; font-weight:600; white-space:nowrap; }
    .status-idle    { background:var(--bg-inset); color:var(--text-tertiary); }
    .status-running { background:var(--accent-bg); color:var(--accent); }
    .status-finished{ background:var(--green-bg); color:var(--green); }
    .status-paused  { background:var(--amber-bg); color:var(--amber); }
    .status-error   { background:var(--red-bg); color:var(--red); }
    .status-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
    .status-running .status-dot { animation:pulse 1.4s ease-in-out infinite; }
    .status-paused  .status-dot { animation:pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.25;transform:scale(.7)} }

    /* ═══════════════════════════════════════════════════════════════════
       Tabs
       ═══════════════════════════════════════════════════════════════════ */
    .tabs { display:flex; gap:4px; padding:5px; background:var(--bg-elevated);
      border:1px solid var(--border); border-radius:var(--radius-sm);
      box-shadow:var(--shadow-sm); overflow-x:auto; }
    .tab-btn { padding:8px 18px; border:none; background:none; font-family:var(--font);
      font-size:13px; font-weight:500; color:var(--text-secondary); border-radius:7px;
      cursor:pointer; white-space:nowrap; transition:color .15s,background .15s,box-shadow .15s; }
    .tab-btn:hover { color:var(--text); background:var(--bg-hover); }
    .tab-btn.active {
      background:var(--accent); color:#fff; font-weight:600;
      box-shadow:0 2px 8px rgba(0,113,227,.28);
    }
    .tab-badge { display:inline-flex; align-items:center; justify-content:center;
      min-width:18px; height:18px; border-radius:9px;
      background:rgba(255,255,255,.25); color:#fff;
      font-size:10px; font-weight:700; margin-left:4px; padding:0 5px; }
    .tab-btn:not(.active) .tab-badge { background:var(--accent); color:#fff; }
    .tab-kbd { font-size:9px; color:var(--text-tertiary); margin-left:3px; opacity:.5; }
    .tab-btn.active .tab-kbd { color:rgba(255,255,255,.45); opacity:1; }

    /* ═══════════════════════════════════════════════════════════════════
       Cards & Panels
       ═══════════════════════════════════════════════════════════════════ */
    .card { background:var(--bg-elevated); border:1px solid var(--border);
      border-radius:var(--radius); box-shadow:var(--shadow-md); overflow:hidden; }
    .card-header { display:flex; align-items:center; gap:12px; padding:13px 20px;
      border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .card-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.09em;
      color:var(--text-secondary); }
    .card-body { padding:16px 20px; }
    .card-body.inset { background:var(--bg-inset); }

    /* ═══════════════════════════════════════════════════════════════════
       Goal
       ═══════════════════════════════════════════════════════════════════ */
    .goal-display { font-size:14px; line-height:1.6; padding:0;
      background:var(--bg-elevated); border-radius:var(--radius);
      color:var(--text-secondary); border:1px solid var(--border);
      box-shadow:var(--shadow-sm); overflow:hidden; cursor:pointer; }
    .goal-display-header { display:flex; align-items:center; gap:10px; padding:12px 18px;
      user-select:none; transition:background .15s; }
    .goal-display-header:hover { background:var(--bg-hover); }
    .goal-display-header h3 { font-size:14px; font-weight:600; color:var(--text); margin:0; flex:1; min-width:0; }
    .goal-display-header .goal-chevron { font-size:11px; color:var(--text-tertiary); transition:transform .2s ease; }
    .goal-display.open .goal-chevron { transform:rotate(180deg); }
    .goal-display-body { display:none; padding:0 18px 14px; border-top:1px solid var(--border); }
    .goal-display.open .goal-display-body { display:block; }
    .goal-display .plan-meta { display:flex; gap:14px; flex-wrap:wrap; margin:10px 0; }
    .goal-display .plan-meta-item { font-size:12px; color:var(--text-tertiary); }
    .goal-display .plan-meta-item strong { color:var(--text-secondary); }
    .goal-display .plan-section { margin-top:10px; }
    .goal-display .plan-section-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-tertiary); margin-bottom:4px; }
    .goal-display .plan-tags { display:flex; gap:4px; flex-wrap:wrap; }
    .goal-display .plan-tag { font-size:11px; padding:2px 9px; border-radius:10px; background:var(--bg-inset); color:var(--text-secondary); }

    /* ═══════════════════════════════════════════════════════════════════
       Progress Bar
       ═══════════════════════════════════════════════════════════════════ */
    .progress-container { display:flex; align-items:center; gap:12px; padding:10px 20px; }
    .progress-track { flex:1; height:5px; background:var(--bg-inset); border-radius:3px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:3px;
      background:linear-gradient(90deg,var(--accent),var(--green)); transition:width .5s ease; }
    .progress-label { font-size:12px; color:var(--text-tertiary); white-space:nowrap; font-variant-numeric:tabular-nums; }

    /* ═══════════════════════════════════════════════════════════════════
       Graph Flow
       ═══════════════════════════════════════════════════════════════════ */
    .graph-flow { overflow:auto; padding:12px 4px 8px; max-height:360px; }
    .gf-canvas { position:relative; display:block; }
    .gf-node { display:flex; flex-direction:column; align-items:center; justify-content:center;
      cursor:pointer; border-radius:8px; border:1.5px solid var(--border);
      background:var(--bg-elevated); transition:border-color .15s ease, background .15s ease;
      padding:6px 4px 4px; box-sizing:border-box; }
    .gf-node:hover { border-color:var(--border-strong); background:var(--bg-hover); }
    .gf-node.active { border-color:var(--accent); background:var(--accent-bg); }
    .gf-node.done { border-color:color-mix(in srgb,var(--green) 55%,var(--border)); }
    .gf-node.failed { border-color:var(--red); background:color-mix(in srgb,var(--red) 10%,var(--bg-elevated)); }
    .gf-node.selected { box-shadow:0 0 0 2px var(--accent); }
    @keyframes stepPulse{0%,100%{box-shadow:0 0 0 0 rgba(10,132,255,.35)}50%{box-shadow:0 0 0 6px rgba(10,132,255,0)}}
    .gf-dot { width:22px; height:22px; border-radius:6px; background:var(--bg-inset);
      display:flex; align-items:center; justify-content:center;
      font-size:11px; flex-shrink:0; margin-bottom:3px; transition:all .15s ease; }
    .gf-dot.active { background:var(--accent); color:#fff; animation:stepPulse 1.2s ease-in-out infinite; }
    .gf-dot.done { background:var(--green); color:#fff; }
    .gf-dot.failed { background:var(--red); color:#fff; }
    .gf-label { font-size:8.5px; font-weight:600; text-align:center; color:var(--text-secondary);
      max-width:76px; word-break:break-word; line-height:1.2; }
    .gf-node.done .gf-label { color:var(--green); }
    .gf-node.active .gf-label { color:var(--accent); }
    .gf-kind { font-size:6.5px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

    /* Node detail panel */
    .graph-detail { margin-top:12px; padding:16px; background:var(--bg-inset); border-radius:var(--radius-sm);
      border:1px solid var(--border); animation:fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    .graph-detail h4 { font-size:13px; font-weight:700; margin-bottom:10px; color:var(--text);
      display:flex; align-items:center; gap:8px; }
    .graph-detail .gd-icon { width:26px; height:26px; border-radius:6px; display:flex; align-items:center;
      justify-content:center; font-size:13px; flex-shrink:0; }
    .graph-detail .gd-icon.agent { background:var(--accent-bg); }
    .graph-detail .gd-icon.control { background:var(--purple-bg); }
    .gd-field { margin-bottom:10px; }
    .gd-field-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-tertiary); margin-bottom:3px; }
    .gd-field-value { font-size:12px; color:var(--text-secondary); font-family:var(--mono); line-height:1.5;
      max-height:160px; overflow-y:auto; white-space:pre-wrap; word-break:break-word; }
    .gd-ports { display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
    .gd-port { font-size:11px; padding:3px 9px; border-radius:6px; background:var(--bg-elevated);
      border:1px solid var(--border); color:var(--text-secondary); }
    .gd-port .kind { color:var(--accent); font-weight:600; }

    /* ═══════════════════════════════════════════════════════════════════
       Charts
       ═══════════════════════════════════════════════════════════════════ */
    .charts-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .mini-chart-wrap { background:var(--bg-inset); border-radius:var(--radius-sm); padding:10px 12px; border:1px solid var(--border); }
    .mini-chart-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
      color:var(--text-tertiary); margin-bottom:4px; }
    .mini-chart-svg { width:100%; height:auto; aspect-ratio:1.7; overflow:visible; }

    /* ═══════════════════════════════════════════════════════════════════
       Budget Gauges
       ═══════════════════════════════════════════════════════════════════ */
    .budget-gauges { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
    .gauge { background:var(--bg-inset); border-radius:var(--radius-sm); padding:12px 16px; border:1px solid var(--border); }
    .gauge-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
    .gauge-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-tertiary); }
    .gauge-value { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text-secondary); }
    .gauge-track { height:6px; background:var(--bg-elevated); border-radius:3px; overflow:hidden; }
    .gauge-fill { height:100%; border-radius:3px; transition:width .4s ease; }
    .gauge-fill.safe { background:linear-gradient(90deg,var(--green),var(--accent)); }
    .gauge-fill.warn { background:var(--amber); }
    .gauge-fill.danger { background:linear-gradient(90deg,var(--amber),var(--red)); }

    /* ═══════════════════════════════════════════════════════════════════
       Token Breakdown
       ═══════════════════════════════════════════════════════════════════ */
    .token-card { flex:1; min-width:120px; background:var(--bg-inset); border-radius:var(--radius-sm); padding:12px 16px; text-align:center; border:1px solid var(--border); }
    .token-card-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-tertiary); margin-bottom:5px; }
    .token-card-val { font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }
    .token-card-sub { font-size:10px; color:var(--text-tertiary); margin-top:3px; }
    .token-card-total .token-card-val { color:var(--text); }
    .token-combined { display:flex; gap:0; align-items:stretch; background:var(--bg-inset); border-radius:var(--radius-sm); border:1px solid var(--border); overflow:hidden; min-width:200px; }
    .token-combined-metric { text-align:center; flex:1; padding:12px 14px; }
    .token-combined-divider { width:1px; background:var(--border); flex-shrink:0; }
    .tc-in .token-combined-metric-val { color:var(--amber); }
    .tc-out .token-combined-metric-val { color:var(--purple); }
    .token-combined-metric-val { font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
    .token-combined-metric-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-tertiary); margin-bottom:3px; }
    .token-combined-metric-sub { font-size:9px; color:var(--text-tertiary); margin-top:2px; }

    /* ═══════════════════════════════════════════════════════════════════
       Hypotheses
       ═══════════════════════════════════════════════════════════════════ */
    .hyp-toolbar { display:flex; gap:8px; align-items:center; padding:0 20px 12px; flex-wrap:wrap; }
    .hyp-search { flex:1; min-width:180px; padding:7px 12px; border:1px solid var(--border);
      border-radius:8px; background:var(--bg-inset); color:var(--text); font-size:13px;
      font-family:var(--font); outline:none; transition:border-color .15s,box-shadow .15s; }
    .hyp-search:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
    .hyp-search::placeholder { color:var(--text-tertiary); }
    .hyp-filter { padding:5px 12px; border-radius:var(--radius-pill); font-size:12px; font-weight:600;
      cursor:pointer; border:1px solid var(--border); background:var(--bg-elevated);
      color:var(--text-secondary); transition:all .15s; }
    .hyp-filter:hover { border-color:var(--border-strong); color:var(--text); }
    .hyp-filter.active { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 2px 6px rgba(0,113,227,.25); }
    .hyp-count { font-size:12px; color:var(--text-tertiary); margin-left:auto; white-space:nowrap; }
    .hyp-list { display:flex; flex-direction:column; gap:6px; padding:0 20px 16px; }
    .hyp-card { background:var(--bg-elevated); border:1px solid var(--border);
      border-left:3px solid var(--border); border-radius:0 var(--radius-sm) var(--radius-sm) 0;
      overflow:hidden; transition:all .15s; cursor:pointer; }
    .hyp-card:hover { border-color:var(--border-strong); box-shadow:var(--shadow-sm); }
    .hyp-card.eliminated { opacity:.4; }
    .hyp-card.open { border-left-color:var(--accent); border-color:var(--accent); }
    .hyp-card.rc1 { border-left-color:var(--amber); }
    .hyp-card.rc2 { border-left-color:var(--text-tertiary); }
    .hyp-card.rc3 { border-left-color:#b0733a; }
    .hyp-card-header { display:flex; align-items:center; gap:12px; padding:11px 14px; }
    .hyp-rank { min-width:24px; height:24px; border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:10px; font-weight:800; flex-shrink:0; }
    .hyp-rank.rc1 { background:var(--amber-bg); color:var(--amber); }
    .hyp-rank.rc2 { background:var(--bg-inset); color:var(--text-secondary); }
    .hyp-rank.rc3 { background:rgba(172,104,54,.15); color:#b0733a; }
    .hyp-rank.rcn { background:var(--bg-inset); color:var(--text-tertiary); }
    .hyp-card-body { flex:1; min-width:0; }
    .hyp-statement { font-size:13px; font-weight:600; line-height:1.5; color:var(--text); }
    .hyp-tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }
    .htag { display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:8px;
      font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
    .htag-new { background:var(--green-bg); color:var(--green); }
    .htag-evolved { background:var(--purple-bg); color:var(--purple); }
    .htag-reviewed { background:var(--accent-bg); color:var(--accent); }
    .htag-eliminated { background:var(--red-bg); color:var(--red); }
    .htag-op { background:var(--teal-bg); color:var(--teal); }
    .hyp-score-col { display:flex; flex-direction:column; align-items:flex-end; flex-shrink:0; gap:2px; }
    .hyp-elo { font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
    .hyp-elo.up { color:var(--green); }
    .hyp-elo.down { color:var(--red); }
    .hyp-elo.neutral { color:var(--amber); }
    .hyp-elo-label { font-size:8px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.04em; }
    .hyp-debate-scores { display:flex; gap:4px; margin-top:1px; }
    .hyp-ds { font-size:10px; font-weight:600; color:var(--text-secondary); }
    .hyp-ds span { color:var(--text-tertiary); font-weight:400; }
    .hyp-card-detail { display:none; padding:0 14px 14px 50px; border-top:1px solid var(--border); }
    .hyp-card.open .hyp-card-detail { display:block; }
    .detail-block { margin-top:12px; }
    .detail-label { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
      color:var(--text-tertiary); margin-bottom:5px; }
    .detail-text { font-size:13px; line-height:1.6; color:var(--text-secondary); }
    .detail-text strong { color:var(--text); }
    .detail-text em { color:var(--text-secondary); font-style:italic; }
    .detail-text code { background:var(--bg-inset); padding:1px 5px; border-radius:4px; font-family:var(--mono); font-size:12px; }
    .detail-text ul, .detail-text ol { padding-left:18px; margin:5px 0; }
    .detail-text li { margin:3px 0; }
    .detail-text p { margin:5px 0; }
    .detail-text a { color:var(--accent); }
    .review-block { background:var(--bg-inset); border-radius:var(--radius-sm); padding:12px 14px; margin-top:8px; border:1px solid var(--border); }
    .review-block-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .review-role { font-size:10px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.05em; }
    .review-score { font-size:14px; font-weight:800; color:var(--amber); }
    .review-text { font-size:12px; line-height:1.55; color:var(--text-secondary); }
    .review-text strong { color:var(--text); }
    .review-text em { font-style:italic; }

    /* ═══════════════════════════════════════════════════════════════════
       Tournament
       ═══════════════════════════════════════════════════════════════════ */
    .tournament-wrap { padding:0 20px 16px; overflow-x:auto; }
    .tournament-table { width:100%; border-collapse:collapse; font-size:13px; }
    .tournament-table th { text-align:left; font-size:10px; font-weight:700; color:var(--text-tertiary);
      text-transform:uppercase; letter-spacing:.08em; padding:8px 12px; border-bottom:1px solid var(--border); }
    .tournament-table td { padding:8px 12px; border-bottom:1px solid var(--border); color:var(--text-secondary); }
    .tournament-table tr:hover td { background:var(--bg-hover); }
    .elo-cell { font-weight:700; font-variant-numeric:tabular-nums; }
    .elo-cell.up { color:var(--green); }
    .elo-cell.down { color:var(--red); }
    .elo-cell.neutral { color:var(--amber); }
    .elo-change-up { color:var(--green); font-size:11px; font-weight:600; }
    .elo-change-down { color:var(--red); font-size:11px; font-weight:600; }

    /* ═══════════════════════════════════════════════════════════════════
       Events — timeline style
       ═══════════════════════════════════════════════════════════════════ */
    .event-filters { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
    .event-filter { padding:3px 9px; border-radius:var(--radius-pill); font-size:10px; font-weight:600;
      cursor:pointer; border:1px solid var(--border); background:transparent;
      color:var(--text-tertiary); transition:all .15s; }
    .event-filter:hover { border-color:var(--border-strong); color:var(--text-secondary); }
    .event-filter.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .event-log { max-height:500px; overflow-y:auto; font-size:12px; }
    .event-log .empty { color:var(--text-tertiary); font-style:italic; font-size:13px; padding:10px 0; }
    /* Wrapper: left accent border by category */
    .event-wrapper { border-bottom:1px solid var(--border); border-left:3px solid transparent; transition:background .1s; }
    .event-wrapper:last-child { border-bottom:none; }
    .event-wrapper:hover { background:var(--bg-hover); }
    .event-wrapper[data-cat="tool"]       { border-left-color:var(--teal); }
    .event-wrapper[data-cat="activation"] { border-left-color:var(--accent); }
    .event-wrapper[data-cat="cycle"]      { border-left-color:var(--green); }
    .event-wrapper[data-cat="error"]      { border-left-color:var(--red); }
    .event-wrapper[data-cat="retry"]      { border-left-color:var(--amber); }
    .event-wrapper[data-cat="lifecycle"]  { border-left-color:var(--text-tertiary); }
    /* Row layout */
    .event-line { padding:9px 14px; line-height:1.5; display:flex; gap:8px; align-items:center; }
    .event-expandable { cursor:pointer; }
    .event-expandable:hover .event-body { opacity:.8; }
    /* Colored dot replaces noisy text badge */
    .event-type-badge { font-size:0; width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--text-tertiary); order:0; }
    .event-type-badge.tool       { background:var(--teal); }
    .event-type-badge.activation { background:var(--accent); }
    .event-type-badge.cycle      { background:var(--green); }
    .event-type-badge.lifecycle  { background:var(--text-tertiary); }
    .event-type-badge.error      { background:var(--red); }
    .event-type-badge.retry      { background:var(--amber); }
    /* Body */
    .event-body { color:var(--text-secondary); flex:1; min-width:0; word-break:break-word; order:1; font-family:var(--mono); font-size:12px; }
    .event-body strong { color:var(--text); }
    /* Node badge */
    .ev-node { color:var(--accent); font-weight:700; font-size:11px; font-family:var(--font);
      background:var(--accent-bg); border-radius:4px; padding:1px 6px; }
    .event-body .error-detail { color:var(--red); }
    /* Chevron */
    .event-chevron { color:var(--text-tertiary); flex-shrink:0; width:14px; text-align:center; font-style:normal; order:9; }
    /* Timestamp — right-aligned */
    .event-ts { color:var(--text-tertiary); font-size:10px; white-space:nowrap; font-family:var(--mono); order:10; margin-left:auto; flex-shrink:0; padding-left:12px; }
    /* Inline decorators */
    .ev-round { color:var(--text-tertiary); font-size:9px; font-weight:700; font-family:var(--font);
      background:var(--bg-active); padding:1px 5px; border-radius:4px; margin-right:2px; }
    .ev-sep { color:var(--border-strong); }
    .ev-dim { color:var(--text-tertiary); }
    .ev-cycle { font-weight:700; color:var(--green); letter-spacing:.01em; }
    /* Expandable detail panel */
    .event-detail { padding:8px 18px 12px 22px; background:var(--bg-inset); border-top:1px solid var(--border); font-family:var(--mono); }
    .event-detail-section { margin-bottom:10px; }
    .event-detail-section:last-child { margin-bottom:0; }
    .event-detail-label { font-size:9px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
      color:var(--text-tertiary); margin-bottom:5px; font-family:var(--font); }
    .event-detail-row { display:flex; gap:10px; align-items:baseline; padding:3px 0; }
    .event-detail-port { color:var(--teal); font-weight:600; min-width:40px; flex-shrink:0; font-size:11px; }
    .event-detail-kind { color:var(--text-secondary); min-width:96px; flex-shrink:0; font-size:11px; }
    .ev-data { color:var(--text); flex:1; word-break:break-all; font-size:11px; }
    .batch-pos { color:var(--text-tertiary); font-weight:600; margin-right:4px; }

    /* ═══════════════════════════════════════════════════════════════════
       Overview
       ═══════════════════════════════════════════════════════════════════ */
    .overview-section { margin-bottom:18px; }
    .overview-section:last-child { margin-bottom:0; }
    .overview-label { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
      color:var(--text-secondary); margin-bottom:10px; padding-bottom:7px;
      border-bottom:1px solid var(--border); }
    .overview-text { font-size:14px; line-height:1.65; color:var(--text-secondary); }
    .overview-text strong { color:var(--text); }
    .overview-text em { font-style:italic; }
    .overview-text code { background:var(--bg-inset); padding:1px 5px; border-radius:4px; font-family:var(--mono); font-size:12px; }
    .overview-text ul, .overview-text ol { padding-left:20px; margin:6px 0; }
    .overview-text li { margin:4px 0; }
    .overview-text p { margin:6px 0; }
    .overview-text a { color:var(--accent); }
    .contact-card { display:flex; align-items:center; gap:12px; background:var(--bg-inset);
      border-radius:var(--radius-sm); padding:12px 16px; margin-top:8px; border:1px solid var(--border); }
    .contact-icon { width:34px; height:34px; border-radius:50%; background:var(--accent-bg);
      display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
    .contact-info { font-size:13px; color:var(--text-secondary); line-height:1.5; }
    .contact-info strong { color:var(--text); }

    /* ═══════════════════════════════════════════════════════════════════
       Error Banner & Loading
       ═══════════════════════════════════════════════════════════════════ */
    #error-banner { background:var(--red-bg); border:1px solid rgba(255,69,58,.25);
      border-radius:var(--radius-sm); color:var(--red); padding:12px 18px; font-size:13px; line-height:1.5; }
    #error-banner:empty { display:none; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--border);
      border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:56px 20px; color:var(--text-tertiary); }
    .empty-icon { font-size:40px; margin-bottom:12px; opacity:.4; }
    .empty-text { font-size:14px; font-weight:500; }
    .empty-sub { font-size:12px; margin-top:5px; opacity:.7; }

    /* ═══════════════════════════════════════════════════════════════════
       Toast
       ═══════════════════════════════════════════════════════════════════ */
    .toast { position:fixed; bottom:24px; right:24px; padding:12px 18px; border-radius:var(--radius-sm);
      background:var(--bg-elevated); border:1px solid var(--border); box-shadow:var(--shadow-lg);
      font-size:13px; color:var(--text); z-index:100; animation:toastIn .3s ease; max-width:380px; }
    .toast.success { border-left:3px solid var(--green); }
    .toast.error   { border-left:3px solid var(--red); }
    @keyframes toastIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    /* ═══════════════════════════════════════════════════════════════════
       Responsive
       ═══════════════════════════════════════════════════════════════════ */
    @media (max-width:1024px) {
      .charts-grid { grid-template-columns:repeat(2,1fr); }
      .budget-gauges { grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width:768px) {
      .app { padding:12px; gap:10px; }
      .header { flex-direction:column; align-items:stretch; }
      .header-main { padding:14px 16px; }
      .header-stats { border-top:1px solid var(--border); overflow-x:auto; }
      .hstat { padding:12px 16px; min-width:60px; }
      .hstat:first-child { border-left:none; }
      .hstat-val { font-size:16px; }
      .header-actions { border-left:none; border-top:1px solid var(--border); padding:10px 16px; justify-content:flex-end; }
      .hyp-list { max-height:60vh; overflow-y:auto; }
      .tab-btn { padding:7px 12px; font-size:12px; }
      .tab-kbd { display:none; }
      .charts-grid { grid-template-columns:1fr; }
      .tournament-wrap { padding:0 10px 12px; }
      .tournament-table { font-size:12px; }
      .tournament-table th, .tournament-table td { padding:6px 8px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div id="error-banner"></div>

  <!-- ═══════════════ HEADER ═══════════════ -->
  <div class="header">
    <div class="header-main">
      <div class="header-logo">⚛</div>
      <div class="header-info">
        <div class="header-title">AI Co-Scientist</div>
        <div class="header-subtitle">Multi-agent scientific hypothesis engine</div>
      </div>
      <div class="status-pill status-idle" id="status-pill">
        <div class="status-dot"></div><span id="status-label">Disconnected</span>
      </div>
    </div>
    <div class="header-stats">
      <div class="hstat"><span class="hstat-val" id="stat-rounds">—</span><span class="hstat-lbl">Round</span></div>
      <div class="hstat"><span class="hstat-val" id="stat-elapsed">—</span><span class="hstat-lbl">Elapsed</span></div>
      <div class="hstat"><span class="hstat-val" id="stat-cost" title="Cost requires per-model pricing in config">$0.00</span><span class="hstat-lbl">Cost</span></div>
      <div class="hstat"><span class="hstat-val" id="stat-tokens-in">0</span><span class="hstat-lbl">In Tok</span></div>
      <div class="hstat"><span class="hstat-val" id="stat-tokens-out">0</span><span class="hstat-lbl">Out Tok</span></div>
    </div>
    <div class="header-actions">
      <button class="btn icon" id="btn-theme" title="Toggle theme (T)" aria-label="Toggle color theme">◐</button>
      <button class="btn" id="btn-refresh" title="Refresh now (R)" aria-label="Refresh data">↻ Refresh</button>
      <button class="btn" id="btn-pause" title="Pause run" aria-label="Pause run" style="display:none">⏸ Pause</button>
      <button class="btn" id="btn-resume" title="Resume run" aria-label="Resume run" style="display:none">▶ Resume</button>
      <button class="btn btn-danger" id="btn-cancel" title="Cancel run" aria-label="Cancel run" style="display:none">✕ Cancel</button>
    </div>
  </div>

  <!-- ═══════════════ GOAL ═══════════════ -->
  <div class="goal-display hidden" id="goal-display"></div>

  <!-- ═══════════════ TABS ═══════════════ -->
  <div class="tabs" id="tabs" role="tablist" aria-label="View tabs">
    <button class="tab-btn active" data-tab="metrics" role="tab" aria-selected="true">Metrics<span class="tab-kbd">1</span></button>
    <button class="tab-btn" data-tab="hypotheses" role="tab" aria-selected="false">Hypotheses <span class="tab-badge" id="hyp-count-badge">0</span><span class="tab-kbd">2</span></button>
    <button class="tab-btn" data-tab="overview" role="tab" aria-selected="false" id="tab-overview" style="display:none">Overview<span class="tab-kbd">3</span></button>
  </div>

  <!-- ═══════════════ TAB: METRICS ═══════════════ -->
  <div class="card tab-panel" role="tabpanel" id="panel-metrics">
    <div class="card-header"><span class="card-title">Metrics</span></div>
    <div class="card-body" style="padding:8px 18px 4px;">
      <div class="graph-flow" id="graph-flow"></div>
      <div class="graph-detail" id="graph-detail" style="display:none;"></div>
    </div>
    <!-- Token metrics -->
    <div class="card-body" style="padding:8px 18px;">
      <div id="token-combined" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
    </div>
    <!-- Budget gauges + charts -->
    <div class="card-body" style="padding:4px 18px 8px;">
      <div class="budget-gauges" id="budget-gauges"></div>
      <div class="charts-grid" id="charts-grid" style="margin-top:12px;"></div>
    </div>
    <!-- Events card -->
    <div class="card" style="margin:0 0 0 0; border-top:1px solid var(--border); border-radius:0 0 var(--radius) var(--radius);">
      <div class="card-header">
        <span class="card-title">Live Events</span>
        <div class="event-filters" style="display:flex;gap:4px;align-items:center;">
          <button class="event-filter active" data-filter="all">All</button>
          <button class="event-filter" data-filter="tool">Tools</button>
          <button class="event-filter" data-filter="activation">Activations</button>
          <button class="event-filter" data-filter="cycle">Cycles</button>
          <button class="event-filter" data-filter="lifecycle">Lifecycle</button>
          <button class="event-filter" data-filter="error">Errors</button>
          <button class="event-filter" data-filter="retry">Retries</button>
        </div>
        <button class="btn" id="btn-clear-events" style="margin-left:auto;">Clear</button>
      </div>
      <div class="card-body inset">
        <div class="event-log" id="event-log">
          <span class="empty">No events yet — events stream in via SSE</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════ TAB: HYPOTHESES ═══════════════ -->
  <div class="card tab-panel" role="tabpanel" id="panel-hypotheses" style="display:none">
    <div class="card-header"><span class="card-title">Hypotheses</span></div>
    <div class="hyp-toolbar">
      <input type="text" class="hyp-search" id="hyp-search" placeholder="Search hypotheses…" aria-label="Search hypotheses" />
      <button class="hyp-filter active" data-filter="all">All</button>
      <button class="hyp-filter" data-filter="active">Active</button>
      <button class="hyp-filter" data-filter="eliminated">Eliminated</button>
      <select class="hyp-filter" id="hyp-sort" style="font-size:11px;">
        <option value="elo">Sort: Elo</option>
        <option value="rank">Sort: Rank</option>
        <option value="newest">Sort: Newest</option>
      </select>
      <button class="hyp-filter" id="hyp-view-toggle" data-view="cards" title="Toggle card/table view">☷ Cards</button>
      <button class="btn" id="btn-export-hyps" title="Copy hypotheses as JSON">📋 Export</button>
      <span class="hyp-count" id="hyp-count"></span>
    </div>
    <div class="hyp-list" id="hyp-list"></div>
    <div class="empty-state" id="hyp-empty">
      <div class="empty-icon">🔬</div>
      <div class="empty-text">No hypotheses yet</div>
      <div class="empty-sub">Hypotheses will appear as agents generate and debate them</div>
    </div>
  </div>

  <!-- ═══════════════ TAB: OVERVIEW ═══════════════ -->
  <div class="card tab-panel" role="tabpanel" id="panel-overview" style="display:none">
    <div class="card-header">
      <span class="card-title">Research Overview</span>
      <button class="btn" id="btn-export-overview" style="margin-left:auto;">📋 Copy JSON</button>
    </div>
    <div class="card-body" id="overview-body"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  /* ═══════════════════════════════════════════════════════════════════
     Configuration
     ═══════════════════════════════════════════════════════════════════ */
  const API   = window.location.origin;
  let PIPELINE = []; // populated from graph spec nodes at init

  /* ═══════════════════════════════════════════════════════════════════
     State
     ═══════════════════════════════════════════════════════════════════ */
  const S = {
    lastState: null,
    lastElapsed: 0,
    lastElapsedAt: 0,
    running: false,
    activeTab: 'metrics',
    hypFilter: 'all',
    hypSearch: '',
    hypSort: 'elo',
    eventFilter: 'all',
    openHyps: new Set(),
    lastHyps: [],
    selectedNode: null,
    hypView: 'cards',
    currentRound: 0,
    roundProgress: {},
    timeSeries: [],
    graphSpec: null,
    events: [],
    pendingTools: {},
    maxRounds: 12,
    runId: null,
    refreshGen: 0,
  };

  /* ═══════════════════════════════════════════════════════════════════
     Utilities
     ═══════════════════════════════════════════════════════════════════ */
  const fe = s => {
    if (!s || s < 0) return '0s';
    const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=Math.floor(s%60);
    return h?`${h}h ${m}m`:m?`${m}m ${sec}s`:`${sec}s`;
  };
  const fn = n => n==null?'—':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(Math.round(n));
  const fc = c => !c?'$0.00':c<0.01?`$${c.toFixed(4)}`:`$${c.toFixed(2)}`;
  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const ts = () => new Date().toLocaleTimeString('en-US',{hour12:false});
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

/* ═══════════════════════════════════════════════════════════════════
     Mini Markdown → HTML
     ═══════════════════════════════════════════════════════════════════ */
  function md2html(text) {
    if (!text) return '';
    let html = esc(text);
    // Un-escape markdown-significant characters that were caught by esc().
    // esc() turns `**` into `&amp;ast;&amp;ast;` but since we only escape
    // `&<>"'`, the actual effect is that `*` and `_` pass through esc()
    // unscathed. The regex below only fires when markdown syntax appears
    // immediately after an escaped ampersand — a narrow case for literals
    // like "A & **B**" where esc() produces "A &amp; **B**" and we want
    // the `**` to survive for markdown processing below.
    html = html.replace(/&amp;(\*\*|__|`|_|\*|\[|\]|\(|\)|-|#)/g, (_,c) => c);
    // Bold, italic, code
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
    html = html.replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g, '<em>$1</em>');
    html = html.replace(/(?<!_)_([^_\n]+?)_(?!_)/g, '<em>$1</em>');
    html = html.replace(/`([^`\n]+?)`/g, '<code>$1</code>');
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    // Numbered lists: group consecutive "1. ".."2. " lines into <ol>
    html = html.replace(/((?:^\d+\.\s+.+(?:\n|$))+)/gm, function(m) {
      return '<ol>' + m.replace(/^\d+\.\s+(.+)/gm, '<li>$1</li>') + '</ol>';
    });
    // Bullet lists: group consecutive "- " lines into <ul>
    html = html.replace(/((?:^-\s+.+(?:\n|$))+)/gm, function(m) {
      return '<ul>' + m.replace(/^-\s+(.+)/gm, '<li>$1</li>') + '</ul>';
    });
    // Paragraphs (double newlines)
    html = html.replace(/\n{2,}/g, '</p><p>');
    html = '<p>'+html+'</p>';
    html = html.replace(/<p><\/p>/g, '');
    return html;
  }

  /* ═══════════════════════════════════════════════════════════════════
     Toast
     ═══════════════════════════════════════════════════════════════════ */
  function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast '+(type||'');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => { el.style.opacity='0';el.style.transition='opacity .3s'; }, 2500);
    setTimeout(() => el.remove(), 2800);
  }

  /* ═══════════════════════════════════════════════════════════════════
     Tab Switching
     ═══════════════════════════════════════════════════════════════════ */
  function switchTab(name) {
    S.activeTab = name;
    $$('.tab-btn').forEach(b => { b.classList.toggle('active', b.dataset.tab===name); b.setAttribute('aria-selected', b.dataset.tab===name); });
    $$('.tab-panel').forEach(p => p.style.display='none');
    const panel = document.getElementById('panel-'+name);
    if (panel) panel.style.display='';
    location.hash = '#tab='+name;
    if (S.lastHyps.length && name==='hypotheses') renderHypotheses(S.lastHyps);
    if (name==='overview' && S.lastState) renderOverview(S.lastState.node_outputs);
    if (name==='metrics') {
      if (S.graphSpec) renderGraph();
      renderMetrics();
    }
  }

  document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    switchTab(btn.dataset.tab);
  });

  /* ═══════════════════════════════════════════════════════════════════
     Graph Flow + Detail Renderer
     ═══════════════════════════════════════════════════════════════════ */
  function computeGraphLayout(spec) {
    const nodes = spec.nodes || [];
    const edges = spec.edges || [];
    const fwd = edges.filter(e => !e.feedback);
    const ids = nodes.map(n => n.id);
    const succs = Object.fromEntries(ids.map(id => [id, []]));
    const inDeg = Object.fromEntries(ids.map(id => [id, 0]));
    fwd.forEach(e => {
      if (succs[e.from_node] !== undefined && inDeg[e.to_node] !== undefined) {
        succs[e.from_node].push(e.to_node);
        inDeg[e.to_node]++;
      }
    });
    // Kahn's topological sort → longest-path column assignment
    const col = Object.fromEntries(ids.map(id => [id, 0]));
    const deg = {...inDeg};
    const q = ids.filter(id => deg[id] === 0);
    while (q.length) {
      const id = q.shift();
      for (const nxt of succs[id]) {
        col[nxt] = Math.max(col[nxt], col[id] + 1);
        if (--deg[nxt] === 0) q.push(nxt);
      }
    }
    // Group by column, assign rows
    const byCol = {};
    ids.forEach(id => { const c = col[id]; (byCol[c] = byCol[c] || []).push(id); });
    const row = {};
    Object.values(byCol).forEach(grp => grp.forEach((id, i) => { row[id] = i; }));
    return {
      col, row,
      maxCol: Math.max(0, ...Object.values(col)),
      maxRow: Math.max(0, ...Object.values(row)),
    };
  }

  function renderGraph() {
    const flow = document.getElementById('graph-flow');
    const detail = document.getElementById('graph-detail');
    const spec = S.graphSpec;
    if (!spec || !spec.nodes?.length) {
      flow.innerHTML = '<span class="empty-state" style="padding:16px"><span class="empty-text">Graph spec not loaded</span></span>';
      return;
    }
    const nodes = spec.nodes;
    const edges = spec.edges || [];
    const activeNodes = S.lastState?.active_nodes || [];
    const L = computeGraphLayout(spec);

    // Layout constants
    const NW = 82, NH = 54, CW = 136, RH = 80, PX = 16, PY = 16, FB_H = 56;
    const ncx = id => PX + L.col[id] * CW + NW / 2;
    const ncy = id => PY + L.row[id] * RH + NH / 2;
    const W = PX * 2 + (L.maxCol + 1) * CW;
    const H = PY * 2 + (L.maxRow + 1) * RH + FB_H;

    function nodeStatus(id) {
      if (activeNodes.includes(id)) return 'active';
      return S.roundProgress[id] || 'pending';
    }

    const fwdEdges = edges.filter(e => !e.feedback && L.col[e.from_node] !== undefined && L.col[e.to_node] !== undefined);
    const fbEdges  = edges.filter(e =>  e.feedback && L.col[e.from_node] !== undefined && L.col[e.to_node] !== undefined);

    // SVG edge layer
    let svg = `<svg style="position:absolute;top:0;left:0;width:${W}px;height:${H}px;overflow:visible;pointer-events:none;" viewBox="0 0 ${W} ${H}"><defs>`;
    [['a','var(--border-strong)','1'],['adone','var(--green)','1'],['aactive','var(--accent)','1'],['afb','var(--text-tertiary)','.4']].forEach(([id,fill,op]) => {
      svg += `<marker id="${id}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="${fill}" opacity="${op}"/></marker>`;
    });
    svg += `</defs>`;

    fwdEdges.forEach(e => {
      const x1 = ncx(e.from_node) + NW/2, y1 = ncy(e.from_node);
      const x2 = ncx(e.to_node)  - NW/2, y2 = ncy(e.to_node);
      const dx = Math.abs(x2 - x1) * 0.42;
      const st = nodeStatus(e.from_node);
      const stroke = st==='done' ? 'var(--green)' : st==='active' ? 'var(--accent)' : 'var(--border-strong)';
      const mk = st==='done' ? '#adone' : st==='active' ? '#aactive' : '#a';
      svg += `<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" fill="none" stroke="${stroke}" stroke-width="1.5" marker-end="url(${mk})" opacity="${st==='pending'?'.4':'1'}"/>`;
    });

    fbEdges.forEach((e, i) => {
      const x1 = ncx(e.from_node), y1 = ncy(e.from_node) + NH/2;
      const x2 = ncx(e.to_node),   y2 = ncy(e.to_node)   + NH/2;
      const arcY = PY + (L.maxRow + 1) * RH + 14 + i * 12;
      svg += `<path d="M${x1},${y1} Q${(x1+x2)/2},${arcY} ${x2},${y2}" fill="none" stroke="var(--text-tertiary)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#afb)" opacity="0.4"/>`;
    });
    svg += `</svg>`;

    // Node divs
    let nhtml = '';
    nodes.forEach(n => {
      const st = nodeStatus(n.id);
      const isSel = S.selectedNode === n.id;
      const isCtl = n.kind?.includes('control') || n.kind?.includes('governor');
      const emoji = nodeEmoji(n.id);
      const x = PX + L.col[n.id] * CW;
      const y = PY + L.row[n.id] * RH;
      nhtml += `<div class="gf-node ${st}${isSel?' selected':''}" data-id="${esc(n.id)}"
        style="position:absolute;left:${x}px;top:${y}px;width:${NW}px;height:${NH}px;"
        tabindex="0" role="button" aria-label="${esc(n.id)}">`;
      nhtml += `<div class="gf-dot ${st}">${st==='done'?'✓':st==='failed'?'✗':emoji}</div>`;
      nhtml += `<div class="gf-label">${esc(n.id)}</div>`;
      nhtml += `<div class="gf-kind">${isCtl?'control':'agent'}</div>`;
      nhtml += `</div>`;
    });

    flow.innerHTML = `<div class="gf-canvas" style="position:relative;width:${W}px;height:${H}px;">${svg}${nhtml}</div>`;

    flow.querySelectorAll('.gf-node').forEach(el => {
      el.addEventListener('click', () => {
        const nodeId = el.dataset.id;
        S.selectedNode = S.selectedNode === nodeId ? null : nodeId;
        if (S.selectedNode) renderGraphDetail(nodeId);
        else detail.style.display = 'none';
        renderGraph();
      });
    });

    if (S.selectedNode) renderGraphDetail(S.selectedNode);
    else detail.style.display = 'none';
  }

  function renderGraphDetail(nodeId) {
    const detail = document.getElementById('graph-detail');
    const spec = S.graphSpec;
    const node = spec.nodes.find(n => n.id === nodeId);
    if (!node) { detail.style.display = 'none'; return; }

    const outputs = S.lastState?.node_outputs||{};
    const outList = outputs[nodeId]||[];
    const outPorts = [...new Set(outList.map(o=>o.port))];
const isControl = node.kind?.startsWith('control.') || node.kind?.includes('control');
    const emoji = nodeEmoji(node.id);
    const iconCls = isControl ? 'control' : 'agent';

    let html = `<h4><span class="gd-icon ${iconCls}">${emoji}</span>${esc(node.id)} <span style="font-weight:400;color:var(--text-tertiary);font-size:10px;">${esc(node.kind||'')}</span></h4>`;
    if (node.description) html += `<div class="gd-field"><div class="gd-field-label">Description</div><div class="gd-field-value" style="font-family:var(--font)">${esc(node.description)}</div></div>`;
    if (node.config && node.config !== null && Object.keys(node.config).length) {
      html += `<div class="gd-field"><div class="gd-field-label">Config</div><div class="gd-field-value">${esc(JSON.stringify(node.config, null, 2))}</div></div>`;
    }
    if (outPorts.length) {
      html += `<div class="gd-field"><div class="gd-field-label">Output Ports (${outList.length} emissions)</div><div class="gd-ports">`;
      outPorts.forEach(p => {
        const count = outList.filter(o => o.port===p).length;
        const kinds = [...new Set(outList.filter(o=>o.port===p).map(o=>o.kind))].filter(Boolean);
        html += `<div class="gd-port"><span class="kind">${esc(p)}</span> ×${count}${kinds.length?` (${kinds.map(esc).join(', ')})`:''}</div>`;
      });
      html += `</div></div>`;
    }
    detail.innerHTML = html;
    detail.style.display = '';
  }

  /* ═══════════════════════════════════════════════════════════════════
     Node Emoji Map
     ═══════════════════════════════════════════════════════════════════ */
  function nodeEmoji(id) {
    const map = {
      plan:'📋', generation:'💡', critic:'🔍', advocate:'🛡️',
      evolution:'🔄', meta_review:'📊', ranking:'🏆', proximity:'📏',
      supervisor:'👁️', search:'🔎', arxiv:'📚',
      scatter:'⤨', gather:'⤩', governor:'🎯', router:'↗',
    };
    const lower = id.toLowerCase();
    for (const [k,v] of Object.entries(map)) if (lower.includes(k)) return v;
    return '🤖';
  }

  /* ═══════════════════════════════════════════════════════════════════
     Hypothesis Builder
     ═══════════════════════════════════════════════════════════════════ */
  function buildHypotheses(nodeOutputs) {
    const map = new Map();
    function upsert(h, src) {
      if (!h?.statement) return;
      const k = h.statement;
      if (!map.has(k)) map.set(k, {
        statement:k, rationale:h.rationale, assumptions:h.assumptions||[],
        testable_predictions:h.testable_predictions||[],
        proposed_experiment:h.proposed_experiment,
        operation:h.operation, change_rationale:h.change_rationale,
        parent_indices:h.parent_indices,
        score:null, rank:null, eliminated:false, prevElo:null,
        critic:null, advocate:null, source:src, seenInRounds:new Set(),
        citations:h.citations||[],
      });
      const e = map.get(k);
      if (!e.rationale&&h.rationale) e.rationale=h.rationale;
      if (!e.assumptions?.length&&h.assumptions?.length) e.assumptions=h.assumptions;
      if (!e.proposed_experiment&&h.proposed_experiment) e.proposed_experiment=h.proposed_experiment;
      if (h.operation) e.operation=h.operation;
      if (h.change_rationale) e.change_rationale=h.change_rationale;
      if (h.parent_indices) e.parent_indices=h.parent_indices;
      if (h.citations?.length) e.citations=h.citations;
    }

    const out = nodeOutputs||{};
    (out.generation||[]).forEach(o => (o.data?.hypotheses||[]).forEach(h => upsert(h,'new')));
    (out.evolution||[]).forEach(o => (o.data?.hypotheses||[]).forEach(h => upsert(h,'evolved')));
    (out.critic||[]).forEach(o => {
      (o.data?.reviews||[]).forEach(r => {
        if (r.hypothesis) upsert(r.hypothesis,'reviewed');
        const k = r.hypothesis?.statement;
        if (k&&map.has(k)) {
          const e = map.get(k);
          if (!e.critic||(r.kind&&r.kind!=='initial')) e.critic=r;
          if (r.eliminated) e.eliminated=true;
        }
      });
    });
    (out.advocate||[]).forEach(o => {
      (o.data?.reviews||[]).forEach(r => {
        if (r.hypothesis) upsert(r.hypothesis,'reviewed');
        const k = r.hypothesis?.statement;
        if (k&&map.has(k)) {
          const e = map.get(k);
          if (!e.advocate||r.kind==='debate_synthesis') e.advocate=r;
          if (r.eliminated) e.eliminated=true;
        }
      });
    });
    const ro = (out.ranking||[]).find(o => o.port==='top')||(out.ranking||[])[0];
    (ro?.data?.hypotheses||[]).forEach((h,i) => {
      upsert(h,'ranked');
      const e = map.get(h.statement);
      if (e) {
        if (h.score!=null) { e.prevElo=e.score; e.score=h.score; }
        e.rank=i+1;
        if (h.eliminated) e.eliminated=true;
      }
    });

    const arr = Array.from(map.values());
    if (S.hypSort==='elo') arr.sort((a,b) => (b.score||0)-(a.score||0));
    else if (S.hypSort==='newest') arr.reverse();
    // rank sort is default order
    arr.forEach((h,i) => { if (h.rank==null) h.rank=i+1; });
    return arr;
  }

  /* ═══════════════════════════════════════════════════════════════════
     Render Hypotheses
     ═══════════════════════════════════════════════════════════════════ */
  function renderHypotheses(hyps) {
    const grid = document.getElementById('hyp-list');
    const empty = document.getElementById('hyp-empty');
    const countEl = document.getElementById('hyp-count');
    const badge = document.getElementById('hyp-count-badge');
    const searchTerm = S.hypSearch.toLowerCase();

    let filtered;
    if (S.hypFilter==='all') filtered=hyps;
    else if (S.hypFilter==='active') filtered=hyps.filter(h=>!h.eliminated);
    else filtered=hyps.filter(h=>h.eliminated);
    if (searchTerm) filtered=filtered.filter(h => h.statement.toLowerCase().includes(searchTerm)||(h.rationale||'').toLowerCase().includes(searchTerm));

    badge.textContent = hyps.length;
    countEl.textContent = `${filtered.length} hypothesis${filtered.length!==1?'es':''}`;

    if (!hyps.length) { grid.innerHTML=''; empty.style.display='flex'; return; }
    empty.style.display='none';
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">No matching hypotheses</div></div>';
      return;
    }

    if (S.hypView === 'table') {
      // ── Table (tournament) view ──
      let html = '<div class="tournament-wrap" style="padding:0;"><table class="tournament-table"><thead><tr><th>#</th><th>Hypothesis</th><th>Elo</th><th>Δ</th><th>Status</th></tr></thead><tbody>';
      filtered.forEach((h,i) => {
        const delta = h.prevElo!=null&&h.score!=null ? Math.round(h.score-h.prevElo) : null;
        const eloDir = delta===null?'neutral':delta>0?'up':delta<0?'down':'neutral';
        const dHtml = delta!=null&&delta!==0
          ? `<span class="${delta>0?'elo-change-up':'elo-change-down'}">${delta>0?'+':''}${delta}</span> <span class="${delta>0?'elo-change-up':'elo-change-down'}" style="font-size:10px;">${delta>0?'▲':'▼'} ${Math.abs(delta)}</span>`
          : '<span style="color:var(--text-tertiary);font-size:10px;">—</span>';
        html += `<tr>
          <td style="font-weight:700;color:var(--text-tertiary)">${h.rank||i+1}</td>
          <td style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(h.statement)}">${esc(h.statement)}</td>
          <td class="elo-cell ${eloDir}">${Math.round(h.score||0)}</td>
          <td>${dHtml}</td>
          <td>${h.eliminated?'<span class="htag htag-eliminated">Eliminated</span>':'<span class="htag htag-new">Active</span>'}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
      grid.innerHTML = html;
    } else {
      // ── Card view ──
      grid.innerHTML = filtered.map((h,i) => {
        const displayRank = (S.hypSort==='rank'||S.hypSort==='newest') ? (h.rank||i+1) : (i+1);
        const rc = displayRank===1?'rc1':displayRank===2?'rc2':displayRank===3?'rc3':'rcn';
        const isOpen = S.openHyps.has(h.statement);
        const eloDelta = h.prevElo!=null&&h.score!=null ? Math.round(h.score-h.prevElo) : null;
        const eloDir = eloDelta===null?'neutral':eloDelta>0?'up':eloDelta<0?'down':'neutral';
        const scoreHtml = h.score!=null?`<div class="hyp-elo ${eloDir}">${Math.round(h.score)}</div><div class="hyp-elo-label">Elo</div>`:'';
        const cs = h.critic?.score!=null?`<div class="hyp-ds"><span>C </span>${h.critic.score.toFixed(1)}</div>`:'';
        const as = h.advocate?.score!=null?`<div class="hyp-ds"><span>A </span>${h.advocate.score.toFixed(1)}</div>`:'';
        const deltaHtml = eloDelta!=null&&eloDelta!==0?`<div style="font-size:9px;color:${eloDelta>0?'var(--green)':'var(--red)'};font-weight:700">${eloDelta>0?'+':''}${eloDelta}</div>`:'';

        const tags = [];
        if (h.source==='new'&&h.score==null) tags.push('<span class="htag htag-new">New</span>');
        if (h.source==='evolved') tags.push('<span class="htag htag-evolved">Evolved</span>');
        if (h.operation) tags.push(`<span class="htag htag-op">${esc(h.operation)}</span>`);
        if (h.eliminated) tags.push('<span class="htag htag-eliminated">Eliminated</span>');
        if (h.source==='reviewed') tags.push('<span class="htag htag-reviewed">Reviewed</span>');

        return `
        <div class="hyp-card${h.eliminated?' eliminated':''}${isOpen?' open':''} ${rc}" data-stmt="${esc(h.statement)}" tabindex="0" role="button">
          <div class="hyp-card-header">
            <div class="hyp-rank ${rc}">${displayRank}</div>
            <div class="hyp-card-body">
              <div class="hyp-statement">${esc(h.statement)}</div>
              <div class="hyp-tags">${tags.join('')}</div>
            </div>
            <div class="hyp-score-col">${scoreHtml}${deltaHtml}<div class="hyp-debate-scores">${cs}${as}</div></div>
          </div>
          <div class="hyp-card-detail">
            ${h.rationale?`<div class="detail-block"><div class="detail-label">Rationale</div><div class="detail-text">${md2html(h.rationale)}</div></div>`:''}
            ${h.assumptions?.length?`<div class="detail-block"><div class="detail-label">Assumptions</div><div class="detail-text"><ul>${h.assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div></div>`:''}
            ${h.testable_predictions?.length?`<div class="detail-block"><div class="detail-label">Testable Predictions</div><div class="detail-text"><ul>${h.testable_predictions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div>`:''}
            ${h.proposed_experiment?`<div class="detail-block"><div class="detail-label">Proposed Experiment</div><div class="detail-text">${md2html(h.proposed_experiment)}</div></div>`:''}
            ${h.citations?.length?`<div class="detail-block"><div class="detail-label">Citations</div><div class="detail-text"><ul>${h.citations.map(c=>`<li>${esc(c.title||c.id||JSON.stringify(c))}</li>`).join('')}</ul></div></div>`:''}
            ${h.parent_indices?.length?`<div class="detail-block"><div class="detail-label">Evolved From</div><div class="detail-text">Parent indices: ${h.parent_indices.map(i=>i+1).join(', ')}</div></div>`:''}
            ${h.change_rationale?`<div class="detail-block"><div class="detail-label">Evolution: ${esc(h.operation||'refinement')}</div><div class="detail-text">${md2html(h.change_rationale)}</div></div>`:''}
            ${h.critic?`<div class="detail-block"><div class="detail-label">Critic Review</div><div class="review-block"><div class="review-block-head"><span class="review-role">${esc(h.critic.kind||'critic')}</span>${h.critic.score!=null?`<span class="review-score">${h.critic.score.toFixed(1)}/10</span>`:''}</div><div class="review-text">${md2html(h.critic.reasoning||'')}</div></div></div>`:''}
            ${h.advocate?`<div class="detail-block"><div class="detail-label">Advocate Rebuttal</div><div class="review-block"><div class="review-block-head"><span class="review-role">advocate</span>${h.advocate.score!=null?`<span class="review-score">${h.advocate.score.toFixed(1)}/10</span>`:''}</div><div class="review-text">${md2html(h.advocate.rebuttal||h.advocate.reasoning||'')}</div></div></div>`:''}
          </div>
        </div>`;
      }).join('');

      grid.querySelectorAll('.hyp-card').forEach(card => {
        card.addEventListener('click', () => {
          const stmt = card.dataset.stmt;
          const hasDetail = card.querySelector('.hyp-card-detail')?.children.length;
          if (!hasDetail) return;
          card.classList.toggle('open');
          card.classList.contains('open') ? S.openHyps.add(stmt) : S.openHyps.delete(stmt);
        });
      });
    }
  }


  /* ═══════════════════════════════════════════════════════════════════
     Render Overview
     ═══════════════════════════════════════════════════════════════════ */
  function renderOverview(nodeOutputs) {
    const body = document.getElementById('overview-body');
    const ov = (nodeOutputs?.meta_review||[]).find(o=>o.port==='overview');
    if (!ov?.data?.overview) {
      body.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Overview not available yet</div><div class="empty-sub">The Meta-review agent will synthesize findings when the run completes</div></div>';
      return;
    }
    const o = ov.data.overview;
    let html = '';
    if (o.summary) html += `<div class="overview-section"><div class="overview-label">Summary</div><div class="overview-text">${md2html(o.summary)}</div></div>`;
    if (o.key_insights?.length) html += `<div class="overview-section"><div class="overview-label">Key Insights</div><div class="overview-text"><ul>${o.key_insights.map(i=>`<li>${md2html(i)}</li>`).join('')}</ul></div></div>`;
    if (o.open_questions?.length) html += `<div class="overview-section"><div class="overview-label">Open Questions</div><div class="overview-text"><ul>${o.open_questions.map(q=>`<li>${md2html(q)}</li>`).join('')}</ul></div></div>`;
    if (o.suggested_next_steps?.length) html += `<div class="overview-section"><div class="overview-label">Suggested Next Steps</div><div class="overview-text"><ul>${o.suggested_next_steps.map(s=>`<li>${md2html(s)}</li>`).join('')}</ul></div></div>`;
    if (o.research_contacts?.length) {
      html += '<div class="overview-section"><div class="overview-label">Research Contacts</div>';
      o.research_contacts.forEach(c => {
        html += `<div class="contact-card"><div class="contact-icon">👤</div><div class="contact-info"><strong>${esc(c.expertise||'')}</strong><br>${md2html(c.rationale||'')}</div></div>`;
      });
      html += '</div>';
    }
    body.innerHTML = html||'<div class="empty-state"><div class="empty-text">Overview data available but empty</div></div>';
  }

  /* ═══════════════════════════════════════════════════════════════════
     Budget Gauges
     ═══════════════════════════════════════════════════════════════════ */
  function renderBudget(state, budget) {
    const el = document.getElementById('budget-gauges');
    const round = state.rounds||0;
    const elapsed = state.elapsed_secs||0;
    const tokens = state.live_tokens||0;
    const cost = state.live_cost_usd||0;

    const items = [
      { label:'Rounds',    val:round,     max:budget.max_rounds,              fmt:v=>String(v)+' / '+(budget.max_rounds||'—'),         unit:'' },
      { label:'Wallclock', val:elapsed,   max:budget.max_wallclock_secs,      fmt:v=>fe(v)+' / '+fe(budget.max_wallclock_secs||0), unit:'' },
      { label:'Tokens',    val:tokens,    max:budget.max_tokens,              fmt:v=>fn(v)+' / '+fn(budget.max_tokens||0),         unit:'' },
      { label:'Cost (USD)',val:cost,      max:budget.max_cost_usd,            fmt:v=>fc(v)+' / '+fc(budget.max_cost_usd||0),       unit:'' },
    ];

    el.innerHTML = items.map(item => {
      const max = item.max||0;
      const pct = max>0 ? Math.min(100, Math.round((item.val/max)*100)) : 0;
      const cls = max>0 ? (pct>90?'danger':pct>70?'warn':'safe') : 'safe';
      return `<div class="gauge">
        <div class="gauge-header">
          <span class="gauge-label">${item.label}</span>
          <span class="gauge-value">${item.fmt(item.val)}</span>
        </div>
        <div class="gauge-track"><div class="gauge-fill ${cls}" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
  }

  function renderTokenBreakdown(state) {
    const el = document.getElementById('token-combined');
    const inp = state.live_input_tokens||0, out = state.live_output_tokens||0, tot = state.live_tokens||0;
    const cost = state.live_cost_usd||0;
    const secs = Math.max(state.elapsed_secs||1, 1);
    el.innerHTML = `
      <div class="token-combined tc-in">
        <div class="token-combined-metric"><div class="token-combined-metric-label">Input</div><div class="token-combined-metric-val">${fn(inp)}</div><div class="token-combined-metric-sub">${fn(Math.round(inp/secs))}/s</div></div>
        <div class="token-combined-divider"></div>
        <div class="token-combined-metric"><div class="token-combined-metric-label">Output</div><div class="token-combined-metric-val">${fn(out)}</div><div class="token-combined-metric-sub">${fn(Math.round(out/secs))}/s</div></div>
      </div>
      <div class="token-card token-card-total"><div class="token-card-label">Total Tokens</div><div class="token-card-val">${fn(tot)}</div><div class="token-card-sub">${fn(Math.round(tot/secs))}/s</div></div>
      <div class="token-card token-card-total"><div class="token-card-label">Total Cost</div><div class="token-card-val">${fc(cost)}</div><div class="token-card-sub">${fc(cost/(secs/3600))}/hr</div></div>
    `;
  }

  /* ═══════════════════════════════════════════════════════════════════
     Metrics Charts (3 mini charts: Cost, Tokens, Top Elo)
     ═══════════════════════════════════════════════════════════════════ */
  const SERIES = [
    {key:'cost', label:'Cost (USD)', color:'#0a84ff', fmt:fc},
    {key:null, label:'Tokens', multi:[
      {sub:'input_tokens', color:'#ff9f0a', lbl:'Input'},
      {sub:'output_tokens', color:'#bf5af2', lbl:'Output'},
    ], fmt:fn},
    {key:'elo', label:'Top Elo', color:'#30d158', fmt:v=>v!=null?String(Math.round(v)):'—'},
  ];

  function renderMetrics() {
    const grid = document.getElementById('charts-grid');
    const data = S.timeSeries;
    if (!data.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;padding:20px"><div class="empty-text">Waiting for first data point…</div></div>';
      return;
    }
    const W=340, H=200, PT=12, PR=16, PB=28, PL=48, CW=W-PL-PR, CH=H-PT-PB;

    grid.innerHTML = SERIES.map(ser => {
      if (ser.multi) return renderMultiChart(ser, data, W, H, PT, PR, PB, PL, CW, CH);
      return renderSingleChart(ser, data, W, H, PT, PR, PB, PL, CW, CH);
    }).join('');
  }

  function renderSingleChart(ser, data, W, H, PT, PR, PB, PL, CW, CH) {
    const vals = data.map(d=>d[ser.key]).filter(v=>v!=null);
    if (!vals.length) return `<div class="mini-chart-wrap"><div class="mini-chart-title">${ser.label}</div><div class="mini-chart-svg"><text>No data</text></div></div>`;
    const mn=Math.min(...vals), mx=Math.max(...vals);
    const range = mx-mn||1;
    const sys = data.map(d=>d[ser.key]!=null ? PT+CH*(1-(d[ser.key]-mn)/range) : null);
    const xs = data.map((_,i)=>PL+(i/(data.length-1||1))*CW);
    const pts = xs.map((x,i)=>sys[i]!=null?`${x},${sys[i]}`:null).filter(Boolean);
    const fillId = 'g'+ser.key;

    let html = `<div class="mini-chart-wrap"><div class="mini-chart-title">${ser.label}</div><svg class="mini-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
    html += `<defs><linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${ser.color}" stop-opacity=".25"/><stop offset="100%" stop-color="${ser.color}" stop-opacity=".02"/></linearGradient></defs>`;

    [0,0.25,0.5,0.75,1].forEach(f => {
      const y=PT+CH*(1-f);
      const val = mn+range*f;
      html += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>`;
      html += `<text x="${PL-5}" y="${y+3}" text-anchor="end" fill="var(--text-tertiary)" font-size="9">${ser.fmt(val)}</text>`;
    });

    if (pts.length===1) {
      const pt = pts[0].split(',');
      html += `<circle cx="${pt[0]}" cy="${pt[1]}" r="4" fill="${ser.color}" stroke="var(--bg-elevated)" stroke-width="1.5"/>`;
    } else if (pts.length>1) {
      html += `<polygon points="${PL},${PT+CH} ${pts.join(' ')} ${xs[data.length-1]},${PT+CH}" fill="url(#${fillId})"/>`;
      html += `<polyline points="${pts.join(' ')}" fill="none" stroke="${ser.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const dStep = Math.max(1, Math.floor(data.length/20));
      data.forEach((d,i) => {
        if (sys[i]!=null && (i%dStep===0||i===data.length-1)) {
          html += `<circle cx="${xs[i]}" cy="${sys[i]}" r="2.5" fill="${ser.color}" stroke="var(--bg-elevated)" stroke-width="1"><title>${fe(d.elapsed)}: ${ser.label} = ${ser.fmt(d[ser.key])}</title></circle>`;
        }
      });
    }

    if (data.length>1) {
      const steps=Math.min(4, data.length-1);
      for (let s=0;s<=steps;s++) {
        const idx=Math.round(s*data.length/steps);
        if (idx>=data.length) continue;
        const x=xs[idx]||PL;
        html += `<text x="${x}" y="${H-8}" text-anchor="middle" fill="var(--text-tertiary)" font-size="9">${fe(data[idx].elapsed)}</text>`;
      }
    }

    html += '</svg></div>';
    return html;
  }

  function renderMultiChart(ser, data, W, H, PT, PR, PB, PL, CW, CH) {
    const lines = ser.multi;
    const allVals = data.flatMap(d=>lines.map(l=>d[l.sub])).filter(v=>v!=null);
    if (!allVals.length) return `<div class="mini-chart-wrap"><div class="mini-chart-title">${ser.label}</div><div class="mini-chart-svg"><text>No data</text></div></div>`;
    const mn=Math.min(...allVals), mx=Math.max(...allVals);
    const range = mx-mn||1;
    const xs = data.map((_,i)=>PL+(i/(data.length-1||1))*CW);

    const lineData = lines.map(line => {
      const sys = data.map(d=>d[line.sub]!=null ? PT+CH*(1-(d[line.sub]-mn)/range) : null);
      const pts = xs.map((x,i)=>sys[i]!=null?`${x},${sys[i]}`:null).filter(Boolean);
      return {color:line.color, label:line.lbl, sys, pts};
    });

    let html = `<div class="mini-chart-wrap"><div class="mini-chart-title">${ser.label}</div><svg class="mini-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;

    [0,0.25,0.5,0.75,1].forEach(f => {
      const y=PT+CH*(1-f);
      const val = mn+range*f;
      html += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>`;
      html += `<text x="${PL-5}" y="${y+3}" text-anchor="end" fill="var(--text-tertiary)" font-size="9">${ser.fmt(val)}</text>`;
    });

    lineData.forEach((ld, li) => {
      if (ld.pts.length===1) {
        const pt = ld.pts[0].split(',');
        html += `<circle cx="${pt[0]}" cy="${pt[1]}" r="4" fill="${ld.color}" stroke="var(--bg-elevated)" stroke-width="1.5"/>`;
      } else if (ld.pts.length>1) {
        html += `<polyline points="${ld.pts.join(' ')}" fill="none" stroke="${ld.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        const dStep = Math.max(1, Math.floor(data.length/20));
        data.forEach((d,i) => {
          if (ld.sys[i]!=null && (i%dStep===0||i===data.length-1)) {
            html += `<circle cx="${xs[i]}" cy="${ld.sys[i]}" r="2.5" fill="${ld.color}" stroke="var(--bg-elevated)" stroke-width="1"><title>${fe(d.elapsed)}: ${ld.label} = ${ser.fmt(d[ld.sub])}</title></circle>`;
          }
        });
      }
    });

    // Legend
    html += `<g transform="translate(${W-PR-80},${PT+4})">`;
    lineData.forEach((ld,li) => {
      html += `<rect x="0" y="${li*16}" width="10" height="10" rx="2" fill="${ld.color}"/>`;
      html += `<text x="14" y="${li*16+9}" fill="var(--text-tertiary)" font-size="9">${ld.label}</text>`;
    });
    html += '</g>';

    if (data.length>1) {
      const steps=Math.min(4, data.length-1);
      for (let s=0;s<=steps;s++) {
        const idx=Math.round(s*data.length/steps);
        if (idx>=data.length) continue;
        const x=xs[idx]||PL;
        html += `<text x="${x}" y="${H-8}" text-anchor="middle" fill="var(--text-tertiary)" font-size="9">${fe(data[idx].elapsed)}</text>`;
      }
    }

    html += '</svg></div>';
    return html;
  }

  /* ═══════════════════════════════════════════════════════════════════
     Event Rendering
     ═══════════════════════════════════════════════════════════════════ */

  /** Extract a human-readable one-line preview from an artifact payload. */
  function artifactPreview(port, kind, data) {
    if (!data || typeof data !== 'object') return esc(String(data||'').slice(0,100));
    const batchPos = (data._batch_index != null && data._batch_total != null)
      ? `<span class="batch-pos">[${data._batch_index+1}/${data._batch_total}]</span>`
      : '';
    const raw =
      data.statement ||
      data.hypothesis?.statement ||
      data.goal?.goal || (typeof data.goal === 'string' ? data.goal : null) ||
      (data.review
        ? `score:${data.review.score != null ? Number(data.review.score).toFixed(2) : '?'} · ${data.review.critique||''}`
        : null) ||
      (Array.isArray(data.hypotheses) ? `${data.hypotheses.length} hypotheses` : null) ||
      (Array.isArray(data.reviews) ? `${data.reviews.length} reviews` : null) ||
      Object.keys(data).filter(k => !k.startsWith('_')).slice(0,4).join(', ');
    const str = typeof raw === 'string' ? raw : JSON.stringify(raw||'');
    const truncated = str.length > 120 ? str.slice(0,120)+'…' : str;
    return `${batchPos}<span class="ev-data">${esc(truncated)}</span>`;
  }

  /** Build the expandable detail pane HTML for inputs and outputs. */
  function buildDetailPanel(ins, outs) {
    const row = item => `<div class="event-detail-row">
      <span class="event-detail-port">${esc(item.port)}</span>
      <span class="event-detail-kind">${esc(item.kind||'')}</span>
      ${artifactPreview(item.port, item.kind, item.data)}
    </div>`;
    let html = '';
