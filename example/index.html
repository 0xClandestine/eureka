    if (ins.length) html += `<div class="event-detail-section"><div class="event-detail-label">Inputs</div>${ins.map(row).join('')}</div>`;
    if (outs.length) html += `<div class="event-detail-section"><div class="event-detail-label">Outputs</div>${outs.map(row).join('')}</div>`;
    return html;
  }

  function renderEvents() {
    const log = document.getElementById('event-log');
    const filtered = S.eventFilter==='all' ? S.events : S.events.filter(e=>e._category===S.eventFilter);
    if (!filtered.length) {
      log.innerHTML = '<span class="empty">No events yet — events stream in via SSE</span>';
      return;
    }
    const wasAtBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.innerHTML = filtered.map(e => {
      const hasDetail = !!e._detail;
      const chevron = hasDetail ? `<span class="event-chevron">▸</span>` : '';
      const line = `<div class="event-line${hasDetail?' event-expandable':''}"><span class="event-ts">${esc(e._ts)}</span><span class="event-type-badge ${e._category}">${e._category}</span><span class="event-body">${e._html}</span>${chevron}</div>`;
      const detail = hasDetail ? `<div class="event-detail" style="display:none">${e._detail}</div>` : '';
      return `<div class="event-wrapper" data-cat="${e._category}">${line}${detail}</div>`;
    }).join('');
    if (wasAtBottom) log.scrollTop = log.scrollHeight;
  }

  function addEvent(e) {
    let cat, body, detail = null;
    const R = e.round != null ? `<span class="ev-round">R${e.round}</span> ` : '';
    const nid = e.nodeId || '';
    if (e.type==='toolCalled') {
      cat='tool';
      body=`${R}<span class="ev-node">${esc(nid)}</span> ⋙ <em>${esc(e.tool||'')}</em>${e.argsSummary ? ': <span style="color:var(--text)">'+esc(e.argsSummary)+'</span>' : ''} <span class="ev-dim">…</span>`;
      let argsSection = '';
      if (e.args && typeof e.args === 'object' && Object.keys(e.args).length) {
        const rows = Object.entries(e.args).map(([k,v]) => {
          const val = typeof v === 'string' ? v : JSON.stringify(v);
          const trunc = val.length > 300 ? val.slice(0,300)+'…' : val;
          return `<div class="event-detail-row"><span class="event-detail-port">${esc(k)}</span><span class="ev-data">${esc(trunc)}</span></div>`;
        }).join('');
        argsSection = `<div class="event-detail-section"><div class="event-detail-label">Input</div>${rows}</div>`;
      }
      const evObj = {_ts:ts(), _category:cat, _html:body, _detail:argsSection||null};
      S.events.unshift(evObj);
      if (S.events.length>500) S.events.length=500;
      const tkey = `${nid}:${e.tool}:${e.round??''}`;
      S.pendingTools[tkey] = evObj;
      if (S.activeTab==='metrics') renderEvents();
      return;
    } else if (e.type==='toolCompleted') {
      const ok = e.success !== false;
      const icon = ok ? '✓' : '✗';
      const color = ok ? 'var(--green)' : 'var(--red)';
      const tkey = `${nid}:${e.tool}:${e.round??''}`;
      const pending = S.pendingTools[tkey];
      if (pending) {
        delete S.pendingTools[tkey];
        // Remove the trailing "…" spinner and stamp result icon onto the row
        pending._html = pending._html.replace(/ <span class="ev-dim">…<\/span>/, '') +
          ` <span style="color:${color}">${icon}</span>`;
        if (e.resultPreview) {
          const trunc = e.resultPreview.length > 500 ? e.resultPreview.slice(0,500)+'…' : e.resultPreview;
          const resultSection = `<div class="event-detail-section"><div class="event-detail-label">Output</div><div class="event-detail-row"><span class="ev-data" style="white-space:pre-wrap">${esc(trunc)}</span></div></div>`;
          pending._detail = (pending._detail || '') + resultSection;
        }
        if (S.activeTab==='metrics') renderEvents();
        return;
      }
      // No matching toolCalled — show as standalone row
      cat='tool';
      body=`${R}<span class="ev-node">${esc(nid)}</span> ⋙ <em>${esc(e.tool||'')}</em> <span style="color:${color}">${icon}</span>`;
      if (e.resultPreview) {
        const trunc = e.resultPreview.length > 500 ? e.resultPreview.slice(0,500)+'…' : e.resultPreview;
        detail = `<div class="event-detail-section"><div class="event-detail-label">Output</div><div class="event-detail-row"><span class="ev-data" style="white-space:pre-wrap">${esc(trunc)}</span></div></div>`;
      }
    } else if (e.type==='activationStarted') {
      cat='activation'; body=`${R}<span class="ev-node">${esc(nid)}</span> <span class="ev-dim">started</span>`;
    } else if (e.type==='activationCompleted') {
      const tok = e.usage?.totalTokens||0;
      const ec = e.emitCount||0;
      if (!ec && !tok) return; // skip zero-impact completions
      const kinds = {};
      (e.outputs||[]).forEach(o => { const k = o.kind||'data'; kinds[k]=(kinds[k]||0)+1; });
      const summary = Object.entries(kinds).map(([k,n]) => `${esc(k)}×${n}`).join(' ');
      const parts = [];
      if (summary) parts.push(summary);
      if (tok) parts.push(`${fn(tok)} tok`);
      if (e.usage?.costUsd) parts.push(fc(e.usage.costUsd));
      cat='activation'; body=`${R}<span class="ev-node">${esc(nid)}</span> → ${parts.join(' <span class="ev-sep">·</span> ')}`;
      const ins = e.inputs||[], outs = e.outputs||[];
      if (ins.length || outs.length) detail = buildDetailPanel(ins, outs);
    } else if (e.type==='activationRetried') {
      cat='retry'; body=`${R}<span class="ev-node">${esc(nid)}</span> retry #${e.attempt||'?'}: <span class="error-detail">${esc(e.error||'')}</span>`;
    } else if (e.type==='activationFailed') {
      cat='error'; body=`${R}<span class="ev-node">${esc(nid)}</span> failed: <span class="error-detail">${esc(e.error||'')}</span>`;
    } else if (e.type==='cycleCompleted') {
      cat='cycle'; body=`<span class="ev-cycle">══ Cycle ${e.round||'?'} complete ══</span>`;
    } else if (e.type==='runHalted') {
      cat='lifecycle'; body=`Run halted · ${esc(e.reason||'')} · ${e.totalRounds||0} rounds`;
    } else if (e.type==='runPaused') {
      cat='lifecycle'; body=`Run paused at round ${e.round||'?'}`;
    } else if (e.type==='runResumed') {
      cat='lifecycle'; body=`Run resumed`;
    } else {
      cat='lifecycle'; body=esc(JSON.stringify(e));
    }
    S.events.unshift({_ts:ts(), _category:cat, _html:body, _detail:detail});
    if (S.events.length>500) S.events.length=500;
    if (S.activeTab==='metrics') renderEvents();
  }

  /* ═══════════════════════════════════════════════════════════════════
     Main Render
     ═══════════════════════════════════════════════════════════════════ */
  function renderState(state) {
    if (!state) return;
    S.lastState = state;
    if (state.run_id) S.runId = state.run_id;

    // Status pill
    const pill = document.getElementById('status-pill');
    let cls, label;
    if (state.finished) { cls='status-finished'; label='Finished'; }
    else if ((state.active_nodes||[]).length) { cls='status-running'; label='Running'; S.running=true; }
    else if (S.lastState&&S.lastState.rounds>0) { cls='status-paused'; label='Paused'; S.running=false; }
    else { cls='status-idle'; label='Connected'; S.running=false; }
    pill.className = 'status-pill '+cls;
    document.getElementById('status-label').textContent = label;

    // Update control buttons
    document.getElementById('btn-pause').style.display = S.running?'':'none';
    document.getElementById('btn-resume').style.display = (!S.running && !state.finished && state.rounds>0)?'':'none';
    document.getElementById('btn-cancel').style.display = (S.running || (!state.finished && state.rounds>0))?'':'none';

    // Stats
    document.getElementById('stat-rounds').textContent = state.rounds??'—';
    S.lastElapsed = state.elapsed_secs||0;
    S.lastElapsedAt = Date.now();
    document.getElementById('stat-elapsed').textContent = fe(S.lastElapsed);
    document.getElementById('stat-cost').textContent = fc(state.live_cost_usd||0);
    const costEl = document.getElementById('stat-cost');
    costEl.title = (state.live_cost_usd||0) > 0 ? '' : 'Cost requires per-model pricing in config (cost_per_million_tokens)';
    document.getElementById('stat-tokens-in').textContent = fn(state.live_input_tokens||0);
    document.getElementById('stat-tokens-out').textContent = fn(state.live_output_tokens||0);

    // Plan / Goal (collapsible)
    const goalEl = document.getElementById('goal-display');
    const planOutput = (state.node_outputs?.plan||[]).find(o => o.port==='out' || o.data?.plan);
    if (planOutput?.data?.plan) {
      const p = planOutput.data.plan;
      let body = '';
      body += '<div class="plan-meta">';
      if (p.domain) body += `<span class="plan-meta-item">Domain: <strong>${esc(p.domain)}</strong></span>`;
      body += '</div>';
      const sections = [
        ['Focus Areas', p.focus_areas],
        ['Hypothesis Criteria', p.hypothesis_criteria],
        ['Evaluation Criteria', p.evaluation_criteria],
        ['Constraints', p.constraints],
      ];
      sections.forEach(([label, items]) => {
        if (items?.length) {
          body += `<div class="plan-section"><div class="plan-section-label">${label}</div><div class="plan-tags">`;
          items.forEach(a => { body += `<span class="plan-tag">${esc(a)}</span>`; });
          body += '</div></div>';
        }
      });
      goalEl.innerHTML = `<div class="goal-display-header"><h3>${esc(p.research_goal||state.goal||'')}</h3><span class="goal-chevron">▼</span></div><div class="goal-display-body">${body}</div>`;
      goalEl.classList.remove('hidden');
      goalEl.onclick = () => { goalEl.classList.toggle('open'); };
    } else if (state.goal) {
      goalEl.classList.remove('hidden');
      goalEl.innerHTML = `<div class="goal-display-header"><h3>Research Goal</h3><span class="goal-chevron">▼</span></div><div class="goal-display-body"><p style="font-style:italic;margin-top:8px;">${esc(state.goal)}</p></div>`;
      goalEl.onclick = () => { goalEl.classList.toggle('open'); };
    }

    // Budget gauges
    const budget = state.budget||{};
    S.maxRounds = budget.max_rounds||S.maxRounds;
    if (S.activeTab==='metrics') {
      renderBudget(state, budget);
      renderTokenBreakdown(state);
    }

    // Stepper
    if ((state.rounds||0) !== S.currentRound) {
      S.currentRound = state.rounds||0;
      PIPELINE.forEach(id => { S.roundProgress[id] = 'pending'; });
    }
    if (state.active_nodes) {
      PIPELINE.forEach(id => {
        if (state.active_nodes.includes(id) && S.roundProgress[id]!=='done') S.roundProgress[id]='active';
      });
    }
    if (state.node_outputs) {
      PIPELINE.forEach(id => {
        if (state.node_outputs[id]?.length && S.roundProgress[id]==='active') S.roundProgress[id]='done';
      });
    }

    const hyps = buildHypotheses(state.node_outputs);
    S.lastHyps = hyps;
    if (S.activeTab==='hypotheses') renderHypotheses(hyps);

    // Overview tab visibility
    const tabOv = document.getElementById('tab-overview');
    const ovAvailable = !!(state.node_outputs?.meta_review||[]).find(o=>o.port==='overview')?.data?.overview;
    tabOv.style.display = ovAvailable||state.finished?'':'none';
    if (S.activeTab==='overview') renderOverview(state.node_outputs);

    document.getElementById('error-banner').textContent = '';
  }

  /* ═══════════════════════════════════════════════════════════════════
     Fetch & SSE
     ═══════════════════════════════════════════════════════════════════ */
  function extractTopScore(nodeOutputs) {
    let best = null;
    if (!nodeOutputs) return null;
    for (const [, outputs] of Object.entries(nodeOutputs)) {
      for (const o of (outputs||[])) {
        const hyps = o?.data?.hypotheses;
        if (!hyps?.length) continue;
        for (const h of hyps) {
          if (h?.score != null && (best == null || h.score > best)) best = h.score;
        }
      }
    }
    return best;
  }

  async function refresh() {
    const gen = ++S.refreshGen;
    try {
      const sr = await fetch(`${API}/api/state`);
      if (!sr.ok) return;
      const state = await sr.json();
      if (gen !== S.refreshGen) return; // stale response
      const pt = {
        elapsed: state.elapsed_secs||0,
        cost: state.live_cost_usd||0,
        input_tokens: state.live_input_tokens||0,
        output_tokens: state.live_output_tokens||0,
        tokens: state.live_tokens||0,
        elo: extractTopScore(state.node_outputs),
      };
      const last = S.timeSeries[S.timeSeries.length-1];
      const changed = !last || pt.cost!==last.cost || pt.input_tokens!==last.input_tokens || pt.output_tokens!==last.output_tokens || pt.elo!==last.elo;
      if (changed || !last || (pt.elapsed-(last.elapsed||0))>=5) {
        S.timeSeries.push(pt);
        if (S.timeSeries.length>300) S.timeSeries.shift();
      }
      // Replay event history on first load so mid-run page loads show past events.
      if (!S._historyLoaded && state.recent_events?.length) {
        S._historyLoaded = true;
        const savedTab = S.activeTab;
        S.activeTab = '_loading'; // suppress per-event renderEvents() calls
        for (const ev of state.recent_events) addEvent(ev);
        S.activeTab = savedTab;
        if (savedTab === 'metrics') renderEvents();
      }
      renderState(state);
      if (S.activeTab==='metrics') {
        renderMetrics();
        renderBudget(state, state.budget||{});
        renderTokenBreakdown(state);
      }
      if (S.activeTab==='metrics' && S.graphSpec) renderGraph();
    } catch(e) {
      console.warn('refresh error:', e);
      const b = document.getElementById('error-banner');
      b.textContent = 'Cannot reach Eureka server at '+API+' — is the daemon running?';
    }
  }

  function connectSSE() {
    if (S._es) return;
    S._es = new EventSource(`${API}/api/events`);
    S._sseRetry = S._sseRetry || 0;
    S._es.onmessage = ev => {
      S._sseRetry = 0;
      try {
        const e = JSON.parse(ev.data);
        addEvent(e);
        if (e.type==='activationStarted' && e.round!==S.currentRound) { S.currentRound = e.round; PIPELINE.forEach(id => { S.roundProgress[id] = 'pending'; }); }
        if (e.type==='activationStarted' && e.nodeId) { S.roundProgress[e.nodeId]='active'; }
        if (e.type==='activationCompleted' && e.nodeId) { S.roundProgress[e.nodeId]='done'; }
        if (e.type==='activationFailed' && e.nodeId) { S.roundProgress[e.nodeId]='failed'; }
        if (e.type==='cycleCompleted'||e.type==='activationCompleted'||e.type==='runHalted') refresh();
      } catch(_) { console.warn('SSE parse error'); }
    };
    S._es.onerror = () => {
      S._es.close(); S._es=null;
      const pill = document.getElementById('status-pill');
      pill.className = 'status-pill status-error';
      document.getElementById('status-label').textContent = 'Disconnected';
      const delay = Math.min(30000, 1000 * Math.pow(2, S._sseRetry));
      S._sseRetry = Math.min(S._sseRetry+1, 5);
      setTimeout(connectSSE, delay);
    };
    S._es.onopen = () => {
      if (!S.running) {
        const pill = document.getElementById('status-pill');
        pill.className = 'status-pill status-idle';
        document.getElementById('status-label').textContent = 'Connected';
      }
    };
  }

  /* ═══════════════════════════════════════════════════════════════════
     Controls
     ═══════════════════════════════════════════════════════════════════ */
  function action(url) {
    if (!S.runId) { toast('No active run to control', 'error'); console.warn('action: no runId — state may not have arrived yet or backend omitted run_id'); return; }
    fetch(`${API}/runs/${S.runId}${url}`, {method:'POST'})
      .then(r => { if (r.ok) toast('Command sent', 'success'); else toast('Command failed', 'error'); })
      .catch(() => toast('Network error', 'error'));
  }

  document.getElementById('btn-pause').addEventListener('click', () => action('/pause'));
  document.getElementById('btn-resume').addEventListener('click', () => action('/resume'));
  document.getElementById('btn-cancel').addEventListener('click', () => { if (confirm('Cancel this run?')) action('/cancel'); });
  document.getElementById('btn-refresh').addEventListener('click', () => refresh());
  document.getElementById('btn-theme').addEventListener('click', () => {
    const root = document.documentElement;
    let next;
    if (root.classList.contains('theme-dark')) { root.classList.remove('theme-dark','theme-light'); next='auto'; }
    else if (root.classList.contains('theme-light')) { root.classList.remove('theme-light','theme-dark'); root.classList.add('theme-dark'); next='dark'; }
    else { root.classList.add('theme-light'); next='light'; }
    try { localStorage.setItem('eureka-theme', next); } catch(_) {}
    document.getElementById('btn-theme').textContent = next==='dark'?'☾':next==='light'?'☀':'◐';
  });
  // Restore theme preference
  (() => {
    try { const t = localStorage.getItem('eureka-theme'); if (t==='dark') document.documentElement.classList.add('theme-dark');
    else if (t==='light') document.documentElement.classList.add('theme-light');
    document.getElementById('btn-theme').textContent = t==='dark'?'☾':t==='light'?'☀':'◐'; } catch(_) {}
  })();

  /* ═══════════════════════════════════════════════════════════════════
     Hypotheses Controls
     ═══════════════════════════════════════════════════════════════════ */
  document.querySelector('.hyp-toolbar').addEventListener('click', e => {
    const btn = e.target.closest('.hyp-filter');
    if (!btn || btn.id==='hyp-view-toggle' || btn.tagName==='SELECT') return;
    document.querySelectorAll('.hyp-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S.hypFilter = btn.dataset.filter;
    if (S.lastState) renderState(S.lastState);
  });
  let _searchTimer = 0;
  document.getElementById('hyp-search').addEventListener('input', e => {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(() => {
      S.hypSearch = e.target.value;
      if (S.lastState) renderState(S.lastState);
    }, 200);
  });
  document.getElementById('hyp-sort').addEventListener('change', e => {
    S.hypSort = e.target.value;
    if (S.lastState) renderState(S.lastState);
  });
  document.getElementById('hyp-view-toggle').addEventListener('click', () => {
    S.hypView = S.hypView === 'cards' ? 'table' : 'cards';
    const btn = document.getElementById('hyp-view-toggle');
    btn.textContent = S.hypView === 'cards' ? '☷ Cards' : '☰ Table';
    btn.dataset.view = S.hypView;
    if (S.lastState) renderState(S.lastState);
  });
  document.getElementById('btn-export-hyps').addEventListener('click', () => {
    const data = S.lastHyps.map(h => ({
      rank:h.rank, statement:h.statement, elo:Math.round(h.score||0),
      eliminated:h.eliminated, source:h.source, operation:h.operation,
      rationale:h.rationale, assumptions:h.assumptions,
      testable_predictions:h.testable_predictions,
      proposed_experiment:h.proposed_experiment,
      critic:h.critic?{kind:h.critic.kind,score:h.critic.score,reasoning:h.critic.reasoning}:null,
      advocate:h.advocate?{kind:h.advocate.kind,score:h.advocate.score,rebuttal:h.advocate.rebuttal}:null,
      citations:h.citations,
    }));
    navigator.clipboard.writeText(JSON.stringify(data,null,2)).then(
      () => toast('Hypotheses copied as JSON', 'success'),
      () => toast('Failed to copy', 'error')
    );
  });

  /* ═══════════════════════════════════════════════════════════════════
     Events Controls
     ═══════════════════════════════════════════════════════════════════ */
  document.querySelector('.event-filters').addEventListener('click', e => {
    const btn = e.target.closest('.event-filter');
    if (!btn) return;
    document.querySelectorAll('.event-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S.eventFilter = btn.dataset.filter;
    renderEvents();
  });
  document.getElementById('btn-clear-events').addEventListener('click', () => {
    S.events.length = 0;
    S.pendingTools = {};
    renderEvents();
  });
  document.getElementById('event-log').addEventListener('click', e => {
    const line = e.target.closest('.event-expandable');
    if (!line) return;
    const wrapper = line.parentElement;
    const detail = wrapper && wrapper.querySelector('.event-detail');
    if (!detail) return;
    const isOpen = detail.style.display !== 'none';
    detail.style.display = isOpen ? 'none' : 'block';
    const chev = line.querySelector('.event-chevron');
    if (chev) chev.textContent = isOpen ? '▸' : '▾';
  });

  /* ═══════════════════════════════════════════════════════════════════
     Overview Export
     ═══════════════════════════════════════════════════════════════════ */
  document.getElementById('btn-export-overview').addEventListener('click', () => {
    const ov = (S.lastState?.node_outputs?.meta_review||[]).find(o=>o.port==='overview')?.data?.overview;
    if (!ov) return toast('No overview available', 'error');
    navigator.clipboard.writeText(JSON.stringify(ov,null,2)).then(
      () => toast('Overview copied as JSON', 'success'),
      () => toast('Failed to copy', 'error')
    );
  });

  /* ═══════════════════════════════════════════════════════════════════
     Keyboard Shortcuts
     ═══════════════════════════════════════════════════════════════════ */
  document.addEventListener('keydown', e => {
    // Let Enter/Space activate keyboard-focused custom clickable elements
    if ((e.key==='Enter'||e.key===' ') && e.target.closest) {
      const el = e.target.closest('.hyp-card, .gf-node, .goal-display');
      if (el) { e.preventDefault(); el.click(); return; }
    }
    if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
    const tabs = ['metrics','hypotheses','overview'];
    if (e.key>='1' && e.key<='3') { const t=tabs[+e.key-1]; if (t) switchTab(t); return; }
    if (e.key==='r'||e.key==='R') { refresh(); return; }
    if (e.key==='t'||e.key==='T') { document.getElementById('btn-theme').click(); return; }
    if (e.key==='Escape') {
      S.openHyps.clear();
      S.selectedNode = null;
      if (S.activeTab==='hypotheses' && S.lastHyps.length) renderHypotheses(S.lastHyps);
      if (S.activeTab==='metrics' && S.graphSpec) renderGraph();
    }
  });

  /* ═══════════════════════════════════════════════════════════════════
     URL Hash Routing
     ═══════════════════════════════════════════════════════════════════ */
  function handleHash() {
    const m = location.hash.match(/tab=(\w+)/);
    if (m) switchTab(m[1]);
  }
  window.addEventListener('hashchange', handleHash);

  /* ═══════════════════════════════════════════════════════════════════
     Bootstrap
     ═══════════════════════════════════════════════════════════════════ */
  async function init() {
    // Fetch graph spec
    try {
      const gr = await fetch(`${API}/api/graph`);
      if (gr.ok) { S.graphSpec = await gr.json(); }
      // Derive pipeline from graph spec nodes (replaces hardcoded list)
      if (S.graphSpec?.nodes?.length) {
        PIPELINE = S.graphSpec.nodes.map(n => n.id);
      }
      // Use max_rounds from graph metadata if available
      if (S.graphSpec?.metadata?.max_rounds) S.maxRounds = S.graphSpec.metadata.max_rounds;
    } catch(_) { console.warn('Graph spec fetch failed'); }
    // Retry once if pipeline is still empty after initial fetch
    if (!PIPELINE.length) {
      try {
        const gr2 = await fetch(`${API}/api/graph`);
        if (gr2.ok) { S.graphSpec = await gr2.json(); }
        if (S.graphSpec?.nodes?.length) PIPELINE = S.graphSpec.nodes.map(n => n.id);
        if (S.graphSpec?.metadata?.max_rounds) S.maxRounds = S.graphSpec.metadata.max_rounds;
      } catch(_) { console.warn('Graph spec retry failed'); }
    }

    // Initial state
    await refresh();
    connectSSE();

    // Periodic polling
    setInterval(refresh, 3000);

    // Live elapsed counter
    setInterval(() => {
      if (!S.running||!S.lastElapsedAt) return;
      document.getElementById('stat-elapsed').textContent = fe(S.lastElapsed+(Date.now()-S.lastElapsedAt)/1000);
    }, 1000);

    // URL hash
    handleHash();
  }

  init();
})();
</script>
</body>
</html>
